<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生态多主体 · 资金计划与预实分析系统 v11</title>
<style>:root{
  --navy:#1F3864;--navy2:#2A4A7F;--ink:#111827;--muted:#6B7280;--line:#E5E7EB;
  --bg:#F4F5F7;--card:#FFFFFF;--in:#C0392B;--out:#2E8B57;--warn:#B45309;
  --warnbg:#FEF3C7;--ok:#166534;--okbg:#E9F6EE;--chip:#EEF2F8;--blue:#2F5597;
  --violet:#6D28D9;--violetbg:#F3EEFF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;background:var(--bg);
  color:var(--ink);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1440px;margin:0 auto;padding:0 20px 64px}
a{color:var(--blue)}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

/* ---------- header ---------- */
header{background:linear-gradient(135deg,#16294A 0%,#1F3864 45%,#2A4A7F 100%);color:#fff;padding:16px 0 0}
header .wrap{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700;letter-spacing:.3px}
.sub{font-size:11.5px;color:#B9C8E2;margin-top:4px}
.hdr-right{display:flex;gap:8px;align-items:center;padding-bottom:14px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);color:#DCE6F7;
  border-radius:999px;padding:3px 10px;font-size:11px;display:inline-flex;gap:5px;align-items:center}
.pill b{color:#fff;font-weight:700}
.pill.warn{background:rgba(254,243,199,.18);border-color:rgba(253,230,138,.45);color:#FDE68A}

/* ---------- nav ---------- */
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;box-shadow:0 1px 3px rgba(0,0,0,.05)}
nav .wrap{display:flex;gap:4px;padding:0 20px;overflow-x:auto}
nav button{background:none;border:none;border-bottom:2.5px solid transparent;padding:12px 14px 10px;
  font-size:12.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px}
nav button b{font-size:10px;background:var(--chip);color:#5B6B85;border-radius:4px;padding:1px 5px;font-weight:700}
nav button.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:700}
nav button.on b{background:var(--navy);color:#fff}
nav .sep{width:1px;background:var(--line);margin:9px 6px}

/* ---------- layout ---------- */
.pane{display:none;padding-top:16px}
.pane.on{display:block}
.pane-title{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pane-title h2{font-size:16px;color:var(--navy)}
.pane-title span{font-size:11.5px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:2px;display:flex;
  justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.card h3 span{font-size:11px;font-weight:400;color:var(--muted)}
.card h4{font-size:12px;font-weight:700;color:#374151;margin:12px 0 6px}
.grid{display:grid;gap:12px;margin-bottom:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g32{grid-template-columns:1.35fr 1fr}.g23{grid-template-columns:1fr 1.35fr}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1080px){.g2,.g3,.g32,.g23,.g4{grid-template-columns:1fr}}
.note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.7}
.note b{color:#374151}
.hr{height:1px;background:var(--line);margin:12px 0}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10.5px;color:var(--muted);letter-spacing:.2px}
.field select,.field input{background:#fff;border:1px solid #D5DAE3;border-radius:6px;padding:6px 8px;
  font-size:12.5px;color:var(--ink);min-width:132px;height:32px}
.field select:focus,.field input:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(42,74,127,.1)}
.field.sm select,.field.sm input{min-width:104px}
.spacer{flex:1}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:6px;padding:7px 13px;
  font-size:12.5px;font-weight:600;transition:.15s}
.btn:hover{background:var(--navy2);border-color:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy);border-color:#C8D2E2}
.btn.ghost:hover{background:#F5F8FD}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn.link{background:none;border:none;color:var(--blue);padding:2px 4px;font-size:11.5px;text-decoration:underline}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
@media(max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--navy)}
.kpi.in:after{background:var(--in)}.kpi.out:after{background:var(--out)}
.kpi.warnline:after{background:var(--warn)}.kpi.okline:after{background:var(--ok)}
.kpi .k{font-size:11px;color:var(--muted);display:flex;gap:5px;align-items:center}
.kpi .v{font-size:19px;font-weight:700;margin-top:5px;letter-spacing:.2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:11px;font-weight:400;color:var(--muted);margin-left:3px}
.kpi .s{font-size:10.5px;color:var(--muted);margin-top:3px}
.kpi .s.up{color:var(--in)}.kpi .s.down{color:var(--out)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:#F7F9FC;color:#4B5563;font-weight:600;text-align:left;padding:7px 8px;
  border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px;position:sticky;top:0}
.tbl td{padding:6px 8px;border-bottom:1px solid #F1F3F7;vertical-align:top}
.tbl tbody tr:hover{background:#FAFBFD}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .in{color:var(--in)}.tbl .out{color:var(--out)}
.tbl .sub{font-size:11px;color:var(--muted)}
.tbl tr.total td{font-weight:700;background:#F7F9FC;border-top:1.5px solid #D8DEE9}
.tbl tr.sec td{background:#F3F6FB;font-weight:700;color:var(--navy);font-size:11.5px}
.tbl tr.alert td{background:#FFFBEB}
.tbl tr.alert:hover td{background:#FEF3C7}
.tbl .r{white-space:nowrap}
.scroll{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.scroll.tall{max-height:600px}

/* ---------- chips / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);color:#41506B;
  border-radius:5px;padding:1px 6px;font-size:10.5px;white-space:nowrap}
.chip.matched{background:var(--okbg);color:var(--ok)}
.chip.pending{background:var(--warnbg);color:var(--warn)}
.chip.manual{background:var(--violetbg);color:var(--violet)}
.chip.bank{background:#E8F0FA;color:#24548C}
.badge{display:inline-block;border-radius:4px;padding:0 5px;font-size:10px;border:1px solid currentColor}
.seg{display:inline-flex;background:#EEF2F8;border-radius:7px;padding:2px}
.seg button{border:none;background:none;padding:4px 10px;border-radius:5px;font-size:11.5px;color:#4B5563}
.seg button.on{background:#fff;color:var(--navy);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.07)}

/* ---------- alert banner ---------- */
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:9px;padding:10px 13px;
  border:1px solid;margin-bottom:12px;font-size:12px}
.banner.warn{background:#FFFBEB;border-color:#FCD34D;color:#78350F}
.banner.info{background:#EFF6FF;border-color:#BFDBFE;color:#1E3A8A}
.banner.ok{background:var(--okbg);border-color:#A7DCB8;color:var(--ok)}
.banner .ic{font-size:14px;line-height:1.35}
.banner b{font-weight:700}

/* ---------- upload ---------- */
.drop{border:1.5px dashed #C3CDDD;border-radius:10px;background:#FAFCFF;padding:22px;text-align:center;
  transition:.15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--navy2);background:#F2F7FF}
.drop .t{font-size:13px;font-weight:700;color:var(--navy)}
.drop .d{font-size:11.5px;color:var(--muted);margin-top:4px}
.drop .fmt{font-size:11px;color:#94A3B8;margin-top:8px}

/* ---------- misc ---------- */
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:12px}
.empty .t{font-size:13px;color:#374151;font-weight:600;margin-bottom:4px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:88px 1fr 92px;gap:8px;align-items:center;font-size:11.5px}
.bar .nm{color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:16px;background:#F1F4F9;border-radius:4px;overflow:hidden;display:flex}
.bar .fi{background:var(--in);height:100%}
.bar .fo{background:var(--out);height:100%}
.bar .vl{text-align:right;font-variant-numeric:tabular-nums;color:#4B5563;font-size:11px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:11.5px}
.kv .k{color:var(--muted)}
.kv .v{text-align:right;font-variant-numeric:tabular-nums}
.mini{font-size:11px;color:var(--muted)}
.mono{font-family:Consolas,"SF Mono",Menlo,monospace;font-size:11px}
.flexrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag-line{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--navy),#6C8DC4);margin-top:6px}
[data-tip]{position:relative;cursor:help;border-bottom:1px dotted #9CA3AF}
[data-tip]:hover:after{content:attr(data-tip);position:absolute;left:0;top:100%;margin-top:5px;z-index:99;
  background:#111827;color:#fff;font-size:11px;line-height:1.5;padding:7px 9px;border-radius:6px;width:260px;
  box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:normal}
.toast{position:fixed;right:22px;bottom:22px;background:#111827;color:#fff;padding:10px 16px;border-radius:8px;
  font-size:12.5px;box-shadow:0 10px 28px rgba(0,0,0,.25);z-index:999;opacity:0;transform:translateY(8px);
  transition:.22s;pointer-events:none;max-width:360px}
.toast.on{opacity:1;transform:none}
.hide{display:none !important}


/* ---------- 左侧栏布局 ---------- */
.app{display:flex;max-width:1600px;margin:0 auto;padding:0 20px 60px;gap:18px;align-items:flex-start}
.side{width:212px;flex:0 0 212px;position:sticky;top:12px;padding:12px 0}
.side .grp{margin-bottom:14px}
.side .grp .t{font-size:10.5px;color:#94A3B8;letter-spacing:.6px;padding:0 10px 5px;font-weight:700}
.side a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;font-size:12.5px;
  color:#3F4B60;text-decoration:none;border-left:2px solid transparent;line-height:1.3}
.side a b{font-size:10px;color:#9AA4B6;font-weight:700;min-width:20px}
.side a:hover{background:#EEF2F8;text-decoration:none}
.side a.on{background:#fff;color:var(--navy);font-weight:700;border-left-color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.side a .cnt{margin-left:auto;background:#FEF3C7;color:#B45309;border-radius:9px;padding:0 6px;font-size:10px}
.main{flex:1;min-width:0;padding-top:14px}
@media(max-width:1000px){
  .app{flex-direction:column;padding:0 12px 40px;gap:6px}
  .side{width:100%;flex:auto;position:static;display:flex;gap:6px;overflow-x:auto;padding:8px 0}
  .side .grp{display:flex;gap:4px;margin:0}
  .side .grp .t{display:none}
  .side a{white-space:nowrap;border-left:none;border-bottom:2px solid transparent;border-radius:0}
  .side a.on{border-bottom-color:var(--navy);box-shadow:none}
}

/* ---------- 步骤条 ---------- */
.steps{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.steps .step{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:8px 14px;font-size:12.5px;color:#8A94A6}
.steps .step b{width:20px;height:20px;border-radius:50%;background:#EEF2F8;color:#8A94A6;
  display:grid;place-items:center;font-size:11px}
.steps .step.on{border-color:var(--navy);color:var(--navy);font-weight:700;box-shadow:0 1px 3px rgba(31,56,100,.09)}
.steps .step.on b{background:var(--navy);color:#fff}
.steps .step.done b{background:var(--okbg);color:var(--ok)}
.steps .arw{color:#C3CDDD;font-size:15px}

/* ---------- 分类 chip ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chipbtn{border:1px solid #DCE3EE;background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;color:#374151}
.chipbtn .n{font-size:10.5px;color:#8A94A6;margin-left:5px}
.chipbtn.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.chipbtn.on .n{color:#C9D6EC}
.chipbtn.dim{color:#B4BCC9;background:#F7F9FC;border-color:#EDF0F5;cursor:not-allowed}
.chipbtn:hover:not(.on):not(.dim){background:#F5F8FD;border-color:#B9C7DC}

/* ---------- 滑块 ---------- */
input[type=range]{accent-color:var(--navy);width:170px;vertical-align:middle}
.slider-wrap{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#4B5563}

/* ---------- 审核台 ---------- */
.tbl select.subj{font-size:11.5px;padding:3px 4px;border:1px solid #D5DAE3;border-radius:5px;max-width:210px;width:100%}
.tbl td .amt-in{width:96px;text-align:right;border:1px solid #E5E7EB;border-radius:4px;padding:2px 4px;font-size:11.5px}
.tbl tr.picked td{background:#F2F7FF}
.selbox{width:14px;height:14px;accent-color:var(--navy)}
.bar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#F7F9FC;border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;margin-bottom:8px}

/* ---------- 弹窗 / 禁用 ---------- */
.btn.off,.btn:disabled{opacity:.45;cursor:not-allowed}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:200;padding:20px}
.modal.hide{display:none}
.modal-box{background:#fff;border-radius:12px;padding:18px 20px;width:min(620px,96vw);box-shadow:0 18px 50px rgba(0,0,0,.28)}
.modal-box h3{font-size:14px;color:var(--navy);display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.modal-box h3 span{font-size:11px;color:var(--muted);font-weight:400}
.modal-box input,.modal-box select{width:100%;border:1px solid #D5DAE3;border-radius:6px;padding:6px 8px;font-size:12.5px;height:32px}
</style>

</head>
<body>
<header>
  <div class="wrap">
    <div>
      <h1>生态多主体 · 资金计划与预实分析系统 <span style="font-size:12px;opacity:.7;font-weight:400">v11</span></h1>
      <div class="sub">口径：bank-flow-recognition · 22 个二级科目 · 仅「已匹配 + 人工确认」流水进入金额口径，待确认单独标注</div>
    </div>
    <div class="hdr-right" id="hdr-badges"></div>
  </div>
</header>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main"><div id="pane"></div></main>
</div>
<div id="toast" class="toast"></div>
<script>/* ============================================================
   v11 核心层（读库版）
   数据一律来自本地数仓 /api/*；前端只做展示聚合，不做科目判断
   ============================================================ */
'use strict';

// 本地起服务时同源访问（任意端口）；直接双击文件时回落到 8770
const API = location.protocol.startsWith('http') ? '' : 'http://127.0.0.1:8770';

const S = {
  meta: null,
  snap: null,
  entity: '珀研',
  period: 'YTD',
  tab: 'g-over',
  flowStep: 1,
  planStep: 1,
  batch: { entity: '', period: '', file: '', sha: '', id: null, status: '' },  // 流水申请
  planBatch: { entity: '', period: '', rows: [], file: '', issues: [], id: null, applicant: '' },
  flowFilter: 'un',        // 人工识别筛选：un 未识别 / id 已识别 / all 全部
  restrKind: '',           // 受限资金卡片：按类别筛选（空=全部）
  pick: {},                // 人工识别页面暂存的科目选择
  sel: new Set(),
  editId: null,
  drillAct: '', drillCat: '', drillSrc: '', drillDir2: 'both', drillMonth: 'ALL', drillAmt: 0,
  err: ''
};

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yuan = n => (n == null || isNaN(n)) ? '—' : Math.round(n).toLocaleString('zh-CN');
const yuan2 = n => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function big(n) {
  if (n == null || isNaN(n)) return '—';
  const a = Math.abs(n);
  if (a >= 1e8) return (n / 1e8).toFixed(2) + '亿';
  if (a >= 1e4) return (n / 1e4).toFixed(a >= 1e6 ? 0 : 1) + '万';
  return Math.round(n).toLocaleString('zh-CN');
}
function pctTxt(v, d = 1) { return v == null || isNaN(v) ? '—' : (v > 0 ? '+' : '') + v.toFixed(d) + '%'; }
/* 环比：▲红=增，▼绿=减，上月为 0 显示 — */
function mom(cur, prev) {
  if (prev == null || !isFinite(prev) || prev === 0 || !isFinite(cur)) return { txt: '—', cls: '' };
  const r = (cur - prev) / Math.abs(prev) * 100;
  return { txt: (r >= 0 ? '▲ ' : '▼ ') + Math.abs(r).toFixed(1) + '%', cls: r >= 0 ? 'up' : 'down', v: r };
}
const momHtml = (cur, prev) => { const m = mom(cur, prev); return `<span class="s ${m.cls}">${m.txt}</span>`; };

function toast(msg, ms) {
  let el = $('#toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), ms || 2800);
}

/* ---------- API ---------- */
async function api(path, opts) {
  let r;
  try {
    r = await fetch(API + path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts || {}));
  } catch (e) {
    // fetch 抛 TypeError：服务没启动 / 跨域预检被拦 / 网络中断
    throw new Error('本地数仓服务未响应（' + API + '）。请双击项目根目录「打开看板v11.bat」启动服务后重试');
  }
  const txt = await r.text();
  let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('返回非 JSON：' + txt.slice(0, 120)); }
  if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
const post = (p, body) => api(p, { method: 'POST', body: JSON.stringify(body) });

async function loadMeta() { S.meta = await api('/api/meta'); }
async function loadSnap() {
  S.snap = await api('/api/snapshot?entity=' + encodeURIComponent(S.entity) + '&period=' + encodeURIComponent(S.period));
  return S.snap;
}
async function reload() { await loadSnap(); render(); }

/* ---------- 数据访问 ---------- */
const E = () => (S.meta ? S.meta.entities : []);
const ENT = s => E().find(e => e.short === s) || {};
const accounts = () => (S.meta ? S.meta.accounts : []);
const SUBMAP = () => (S.meta ? S.meta.subjectMap : []);
const smByCode = c => SUBMAP().find(x => x.code === c) || null;
const rows = () => (S.snap ? S.snap.rows : []);
const plans = () => (S.snap ? S.snap.plans : []);

  const autoRestr = new Map();

    if (!cur || (r.txn_date + r.id) > (cur.txn_date + cur.id)) last.set(k, r);

  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);

function parseFlowFile(rowsArr, fileName, entity) {
  const hi = findHeader(rowsArr, 3);
  if (hi < 0) return { error: '表头识别失败：未找到含「交易日期 / 金额 / 摘要」等列名的表头行' };
  const m = mapHeader(rowsArr[hi]);
  const missing = [];
  if (m.date < 0) missing.push('交易日期');
  if (m.amt < 0 && (m.amtIn < 0 || m.amtOut < 0)) missing.push('金额（或借方/贷方金额）');
  if (m.memo < 0) missing.push('摘要/备注');
  if (missing.length) return { error: '缺列：' + missing.join('、') + '（请按模板字段映射后重传）' };
  const out = [], dupInFile = [];
  const seen = new Map();
  for (let i = hi + 1; i < rowsArr.length; i++) {
    const r = rowsArr[i]; if (!r || !r.length) continue;
    const d = normDate(cellAt(r, m.date));
    let amt = num(cellAt(r, m.amt)), dirRaw = String(cellAt(r, m.dir)).trim();
    if (m.amtIn >= 0 || m.amtOut >= 0) {
      const ain = num(cellAt(r, m.amtIn)), aout = num(cellAt(r, m.amtOut));
      if (!isNaN(ain) && ain) { amt = ain; dirRaw = dirRaw || '收'; }
      else if (!isNaN(aout) && aout) { amt = aout; dirRaw = dirRaw || '支'; }
    }
    if (!d || isNaN(amt) || !amt) continue;
    let dir = '';
    if (/收|贷|流入|^C$|CR/i.test(dirRaw) && !/支|借/.test(dirRaw)) dir = '收';
    else if (/支|借|流出|^D$|DR/i.test(dirRaw)) dir = '支';
    if (!dir) dir = amt < 0 ? '支' : '收';
    const cp = String(cellAt(r, m.cp)).trim(), memo = String(cellAt(r, m.memo)).trim();
    const bal = m.bal >= 0 ? num(cellAt(r, m.bal)) : NaN;
    const key = [d, dir, Math.abs(amt), memo.slice(0, 40), cp.slice(0, 40)].join('|');
    if (seen.has(key)) dupInFile.push({ row: i + 1, first: seen.get(key), date: d, amount: Math.abs(amt), cp, memo });
    else seen.set(key, i + 1);
    out.push({
      date: d, time: (/\d{1,2}:\d{2}(?::\d{2})?/.exec(String(cellAt(r, m.time))) || [''])[0], dir,
      amount: Math.abs(amt), balance: isNaN(bal) ? null : bal,
      cp, cpa: String(cellAt(r, m.cpa)), memo,
      entity, bank: '', account: String(cellAt(r, m.acct)), src: fileName, src_row: i + 1
    });
  }
  return { rows: out, headerIdx: hi, dupInFile };
}

<script>/* ============================================================

'use strict';

/* 缓存：全量行（画 12 期趋势）、上一期行（算环比） */
S.full = null; S.fullKey = ''; S.prev = null; S.prevKey = '';

function prevPeriod(sel) {

  }

}
async function ensureFull() {
  const scope = S.scope || S.entity;
  if (S.full && S.fullKey === scope) return S.full;
  S.full = await api('/api/snapshot?entity=' + encodeURIComponent(scope) + '&period=ALL');
  S.fullKey = scope;

}
async function ensurePrev() {

  try {
    S.prev = await api('/api/snapshot?entity=' + encodeURIComponent(S.scope || S.entity) + '&period=' + encodeURIComponent(p));

/* ---------- 组件 ---------- */
const kpi = (k, v, unit, sub, cls, tip) => `<div class="kpi ${cls || ''}">

const stepper = (step, labels) => `<div class="steps">${labels.map((t, i) => `

const chipBtn = (label, on, attr, val, cnt, dim) =>
  `<button class="chipbtn ${on ? 'on' : ''} ${dim ? 'dim' : ''}" data-${attr}="${esc(val)}">${esc(label)}${cnt != null ? `<span class="n">${cnt}</span>` : ''}</button>`;

/* ---------- 图表 ---------- */
function svgLineBars(months, ins, outs, w) {
  w = w || 700; const h = 220, pl = 52, pr = 14, pt = 16, pb = 30;
  const iw = w - pl - pr, ih = h - pt - pb, max = Math.max(1, ...ins, ...outs);

function svgBalanceTrend(months, vals) {

function svgPair(items, w) {

    b += `<rect x="${labelW}" y="${y + 16}" width="${barW}" height="9" fill="#F1F4F9" rx="2"/><rect x="${labelW}" y="${y + 16}" width="${Math.max(1, d.b / max * barW)}" height="9" fill="#2E8B57" rx="2"/>`;

function svgWaterfall(start, items, end) {
  const w = 720, h = 250, pl = 60, pr = 10, pt = 16, pb = 46;
  const iw = w - pl - pr, ih = h - pt - pb;

function svgPVA(months, acts, plans, w) {

/* ---------- 资金水位（实际 + 预测 + 安全线） ---------- */
function svgWaterline(months, act, fc, safe, w) {
  w = w || 720;

  const iw = w - pl - pr, ih = h - pt - pb;

    safeTag = `<text x="${pl + 6}" y="${ys - 8}" font-size="11" fill="#C0651B">安全线 ${wan(safe)}万</text>`;

  fc.forEach((v, i) => { if (v != null) ptsF.push(`${x(i).toFixed(1)},${y(v).toFixed(1)}`); });

  /* 数据点 + 数值标签 */

  act.forEach((v, i) => {
    if (v == null) return;
    const below = v < (safe || -Infinity);
    dots += `<circle cx="${x(i)}" cy="${y(v)}" r="3.8" fill="#fff" stroke="#1F3864" stroke-width="2"/>`;
    tags += `<text x="${x(i)}" y="${y(v) - 10}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${below ? '#C0392B' : '#1F3864'}">${wan(v)}</text>`;
  });
  fc.forEach((v, i) => {
    if (v == null) return;
    const below = v < (safe || -Infinity);
    dots += `<circle cx="${x(i)}" cy="${y(v)}" r="3.8" fill="#fff" stroke="${below ? '#2E8B57' : '#1F3864'}" stroke-width="2"/>`;
    tags += `<text x="${x(i)}" y="${y(v) + 16}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${below ? '#2E8B57' : '#1F3864'}">${wan(v)}</text>`;
  });

  /* x 轴 */
  let xlab = '';
  months.forEach((m, i) => {

      无计划月按近 3 个月实际净流入月均外推（表中「未来三月净流」已含校准）。点公司名可进透视看逐周水位。</div>

function availOf(snap) {
  if (!snap) return null;
  const last = new Map();
  (snap.rows || []).forEach(r => {
    if (r.balance == null) return;
    const k = r.entity + '|' + r.bank + '|' + (r.account || '');
    const o = last.get(k);
    if (!o || (r.txn_date + r.id) > (o.txn_date + o.id)) last.set(k, r);
  });
  let t = 0, has = false;
  last.forEach(r => {
    const c = ENT(r.entity).ccy || 'CNY';
    const f = c === 'CNY' ? 1 : (snap.fx && snap.fx[c + '/CNY'] ? snap.fx[c + '/CNY'].rate : null);
    if (f) { t += r.balance * f; has = true; }
  });
  return has ? t : null;
}

/* 某月的月末可用余额（按账户取 ≤ 月末的最后一条余额，折人民币） */
function monthEndBal(rowsArr, month, fxmap) {
  const limit = month + '-31';
  const last = new Map();
  rowsArr.forEach(r => {
    if (r.balance == null || r.txn_date > limit) return;
    const k = r.entity + '|' + r.bank + '|' + (r.account || '');
    const o = last.get(k);
    if (!o || (r.txn_date + r.id) > (o.txn_date + o.id)) last.set(k, r);
  });
  let t = 0, has = false;
  last.forEach(r => {
    const c = ENT(r.entity).ccy || 'CNY';
    const f = c === 'CNY' ? 1 : (fxmap && fxmap[c + '/CNY'] ? fxmap[c + '/CNY'].rate : null);
    if (f) { t += r.balance * f; has = true; }
  });
  return has ? t : null;
}
/* 水位序列：最近 N 个实际月 + 未来 3 期
   未来三月净流 = 已审批计划净流入 × 12 个月达成率（无计划月按历史外推，并标注）
   主体数据停在几个月前时，中间空月按同一净流补推算（gapMonths），只把最近 3 个月作为报告期 */
function waterline(e, n) {
  const full = S.full || S.snap;
  const rs = (full.rows || []).filter(r => r.entity === e);
  const fxmap = full.fx || (S.snap && S.snap.fx) || {};
  const months = Array.from(new Set(rs.map(r => r.txn_date.slice(0, 7)))).sort();
  const actMonths = months.slice(-(n || 8));
  // 水位口径＝月末可用：余额 − 该主体自动识别受限（与 KPI「当前可用」同口径）
  const restE = (((full.restricted || {}).accounts) || [])
    .filter(a => a.entity === e).reduce((s, a) => s + (a.amt || 0), 0);
  const act = actMonths.map(m => { const v = monthEndBal(rs, m, fxmap); return v == null ? null : v - restE; });
  const plans = (full.plans || []).filter(p => p.entity === e);
  const lastM = actMonths[actMonths.length - 1] || (S.snap.end || '');
  // 全量流水里的最新月：主体自己的数据停在更早时，预测从最新月往后接
  const globalLast = (full.rows || []).reduce((mx, r) => {
    const mm = r.txn_date.slice(0, 7);
    return mm > mx ? mm : mx;
  }, '');
  const anchor = [lastM, globalLast].filter(Boolean).sort().pop() || lastM;
  const future = [], futureGap = [];
  let cur = lastM;
  if (cur) {
    while (anchor && cur < anchor) { cur = shiftMonth(cur.slice(0, 7), 1).slice(0, 7); future.push(cur); futureGap.push(true); }
    for (let i = 0; i < 3; i++) { cur = shiftMonth(cur.slice(0, 7), 1).slice(0, 7); future.push(cur); futureGap.push(false); }
  }
  const nonInt = rs.filter(r => !isInt(r));
  const netOf = list => list.reduce((s, r) => s + (r.direction === '收' ? cny(r) : -cny(r)), 0);
  const monthNet = m => netOf(nonInt.filter(r => r.txn_date.slice(0, 7) === m));
  const planNetOf = m => plans.filter(p => p.period === m)
    .reduce((s, p) => s + (p.direction === '流入' ? p.amount : -p.amount), 0);
  // 12 个月达成率校准：近 12 个月实际净流入 / 同期计划净流入
  const hist12 = months.filter(m => m <= lastM).slice(-12);
  const act12 = hist12.reduce((s, m) => s + monthNet(m), 0);
  const plan12 = hist12.reduce((s, m) => s + planNetOf(m), 0);
  const planMonths = hist12.filter(m => plans.some(p => p.period === m));
  let k = 1, kNote = '近 12 个月没有已审批计划，达成率按 100% 不校准';
  if (planMonths.length < 3) {
    kNote = '近 12 个月只有 ' + planMonths.length + ' 个月有已审批计划，样本不足 3 个月，达成率按 100% 不校准';
  } else if (plan12 > 0 && act12 > 0) {
    k = Math.max(0.2, Math.min(1.5, act12 / plan12));
    kNote = '近 12 个月实际净流入 ' + big(act12) + ' / 计划 ' + big(plan12) + '，达成率 ' + (k * 100).toFixed(0) + '%';
  } else if (plan12 > 0) {
    kNote = '近 12 个月计划净流入 ' + big(plan12) + '、实际为负或零，达成率按 100% 不校准';
  }
  // 历史外推基线：近 3 个月实际净流入月均
  const last3 = hist12.slice(-3);
  const histMean = last3.length ? last3.reduce((s, m) => s + monthNet(m), 0) / last3.length : 0;
  const base = act.slice().reverse().find(v => v != null) || 0;
  let run = base, extrapolated = false;
  const fc = new Array(actMonths.length).fill(null);
  const planNet = [], fcNet = [], hasPlanArr = [];
  future.forEach(m => {
    const has = plans.some(p => p.period === m);
    const pn = planNetOf(m);
    const v = has ? pn * k : histMean * k;
    if (!has) extrapolated = true;
    planNet.push(has ? pn : null);
    fcNet.push(v);
    hasPlanArr.push(has);
    run += v;
    fc.push(run);
  });
  // 报告期 = 最近 3 个月（不含补空的中间月）
  const repIdx = future.map((m, i) => i).slice(-3);      // 报告期：接在实际月之后的最近三个月（跳过补空月）
  const reportMonths = repIdx.map(i => future[i]);
  const repVals = repIdx.map(i => fc[actMonths.length + i]);
  const repNet = repIdx.map(i => fcNet[i]);
  const net3 = repNet.reduce((s, v) => s + v, 0);
  const line = safeLine(e);
  const minLevel = repVals.length ? Math.min(...repVals) : null;
  const minIdx = repVals.length ? repVals.indexOf(minLevel) : -1;
  let breachIdx = -1;
  repVals.forEach((v, i) => { if (breachIdx < 0 && line > 0 && v < line) breachIdx = i; });
  // 逐周水位：报告月净流按 4.345 周摊
  const weeks = [];
  let wRun = repIdx.length ? (fc[actMonths.length + repIdx[0] - 1] || base) : base;
  reportMonths.forEach((m, i) => {
    const step = (repNet[i] || 0) / 4.345;
    for (let w = 1; w <= 4; w++) { wRun += step * 1.086; weeks.push({ m, w, v: wRun }); }
  });
  const weekMin = weeks.length ? weeks.reduce((a, b) => (b.v < a.v ? b : a)) : null;
  // 覆盖月数：当前可用 / 近 3 个月月均流出的绝对值
  const out3 = last3.map(m => nonInt.filter(r => r.txn_date.slice(0, 7) === m && r.direction === '支')
    .reduce((s, r) => s + cny(r), 0));
  const outAvg = out3.length ? out3.reduce((s, v) => s + v, 0) / out3.length : 0;
  const cover = outAvg > 0 ? base / outAvg : null;
  return {
    months: actMonths.concat(future), act, fc, lastM, anchor, future: reportMonths, gap: Math.max(0, future.length - 3),
    hasPlan: repIdx.some(i => hasPlanArr[i]), base, k, kNote,
    planNet: repIdx.map(i => planNet[i]), fcNet: repNet, planFlags: repIdx.map(i => hasPlanArr[i]),
    net3, extrapolated, line, minLevel, minMonth: minIdx >= 0 ? reportMonths[minIdx] : null,
    breachMonth: breachIdx >= 0 ? reportMonths[breachIdx] : null, weeks, weekMin, cover
  };
}

/* ---------- 1.2 公司资金透视 ---------- */
function paneEntity() {

  const a = agg(all);
  const intAll = all.filter(isInt);
  const intCnt = intAll.length, intAmt = intAll.reduce((s, r) => s + cny(r), 0);
  const prev = S.prev ? agg(S.prev.rows.filter(r => r.entity === e)) : null;
  const acc = accountRows().filter(o => o.entity === e);
  const avail = acc.reduce((s, o) => s + (o.cnyAvail || 0), 0);
  const line = safeLine(e), gap = avail - line;
  const info = ENT(e);
  const pend = (S.full ? S.full : S.snap).rows.length ? 0 : 0;

  // 瀑布：期初 → 流入科目 Top5 → 流出科目 Top5 → 期末
  const inByL2 = Object.entries(grp(all.filter(r => r.direction === '收'), r => r.l2 || '未分类'))
    .map(([k, v]) => ({ name: k, v: agg(v).inflow })).sort((x, y) => y.v - x.v);
  const outByL2 = Object.entries(grp(all.filter(r => r.direction === '支'), r => r.l2 || '未分类'))
    .map(([k, v]) => ({ name: k, v: -agg(v).outflow })).sort((x, y) => x.v - y.v);
  const topIn = inByL2.slice(0, 5), topOut = outByL2.slice(0, 5);
  const restIn = inByL2.slice(5).reduce((s, x) => s + x.v, 0);
  const restOut = outByL2.slice(5).reduce((s, x) => s + x.v, 0);
  const items = topIn.concat(restIn ? [{ name: '其他流入', v: restIn }] : [])
    .concat(topOut, restOut ? [{ name: '其他流出', v: restOut }] : []);
  const endBal = balancesAt(S.snap.end || '');
  const startBal = { total: endBal.total - a.net, missing: endBal.missing };  // 期初由期末倒推，保证瀑布闭合
  // 结构：活动类型 × 方向
  const byAct = ['经营活动', '投资活动', '筹资活动', '内部往来'].map(l1 => {
    const g = agg(all.filter(r => r.l1 === l1));
    return { name: l1, a: g.inflow, b: g.outflow };
  }).filter(x => x.a || x.b);

  return `
  <div class="pane-title"><h2>公司资金透视</h2><span>${esc(info.name || e)} · ${PERIOD_LABEL(S.period)} · 单主体口径：<b>含内部往来</b>（${intCnt} 笔 / ${big(intAmt)}）</span></div>
  <div class="toolbar">
    <div class="field"><label>公司</label><select data-act="entity">${entityOptions(e)}</select></div>
    <div class="field"><label>期间口径</label><select data-act="period">${periodOptions(S.period)}</select></div>
    <div class="field"><label>安全线（万元）</label><input type="number" step="1" data-act="safe" data-e="${esc(e)}" value="${Math.round(line / 10000)}"></div>
    <div class="spacer"></div>
    <div>${gap < 0 ? `<span class="chip pending">低于安全线 缺口 ${big(-gap)}</span>` : `<span class="chip matched">安全垫 ${big(gap)}</span>`}</div>
  </div>
  ${acc.length === 0 && info.pending ? `<div class="banner info"><span class="ic">i</span><div>该主体在样表出现但未进账户主数据，需补登开户行/账号后再接入流水。</div></div>` : ''}

  <div class="kpis">
    ${kpi('可用资金', big(avail), '元', `<span class="s">${acc.length} 个账户</span>`, 'okline')}
    ${kpi('受限资金（自动）', big(acc.reduce((s, o) => s + (o.autoRestricted || 0), 0)), '元',
      `<span class="s">${(restrictedData().accounts || []).filter(a => a.entity === e).length} 个账户 · 人工补录 ${big(acc.reduce((s, o) => s + o.restricted * (o.fx || 1), 0))}</span>`, 'warnline')}
    ${kpi('现金流入', big(a.inflow), '元', momHtml(a.inflow, prev && prev.inflow), 'in')}
    ${kpi('现金流出', big(a.outflow), '元', momHtml(a.outflow, prev && prev.outflow), 'out')}
    ${kpi('净流量', (a.net >= 0 ? '+' : '−') + big(Math.abs(a.net)), '元', `<span class="s">${a.cnt} 笔</span>`, a.net >= 0 ? 'in' : 'out')}
    ${kpi('可用余额（单列）', big(avail), '元', momHtml(avail, availOf(S.prev)))}
  </div>

  ${(() => {
    const wl = waterline(e, 8);
    const nA = wl.act.filter(v => v != null).length, nF = wl.future.length;
    const net3 = wl.net3;
    const fmt = v => (v == null ? '—' : (v >= 0 ? '+' : '−') + big(Math.abs(v)));
    const below = wl.minLevel != null && line > 0 && wl.minLevel < line;
    return `<div class="card" style="margin-bottom:12px">
      <h3>未来三个月资金水位推算 <span>${wl.months[0] || '—'} ~ ${wl.months[wl.months.length - 1] || '—'}（实际 ${nA} 期 + 预测 ${nF} 期）</span></h3>
      ${wl.months.length ? svgWaterline(wl.months, wl.act, wl.fc, line) : '<div class="empty">尚无余额数据</div>'}
      <div class="kpis" style="grid-template-columns:repeat(4,1fr);margin:10px 0 8px">
        ${kpi('当前可用', big(avail), '元', '<span class="s">末笔余额 − 受限资金</span>', 'okline')}
        ${kpi('未来三月净流入', fmt(net3), '元', `<span class="s">达成率 ${(wl.k * 100).toFixed(0)}%${wl.extrapolated ? ' · 含历史外推' : ''}</span>`, net3 >= 0 ? 'in' : 'out')}
        ${kpi('三个月最低水位', wl.minLevel == null ? '—' : big(wl.minLevel), '元', `<span class="s">${wl.minMonth ? wl.minMonth + ' 末' : '无预测'}</span>`, below ? 'warnline' : '')}
        ${kpi('覆盖月数', wl.cover == null ? '—' : wl.cover.toFixed(1), '个月', `<span class="s">按近 3 个月月均支出</span>`, wl.cover != null && wl.cover < 3 ? 'warnline' : '')}
      </div>
      <div class="note">
        <b>推算</b>：当前可用 ${big(avail)} + 未来三个月净流入 ${fmt(net3)}；
        有计划月按「已审批计划净流入 × 达成率 ${(wl.k * 100).toFixed(0)}%」${wl.planFlags.some(f => !f) ? '，无计划月按近 3 个月实际净流入月均外推（已标注）' : ''}；
        安全线 ${(line / 1e4).toFixed(1)} 万。
        <br>${esc(wl.kNote)}。
        ${wl.minLevel == null ? '' : `预测段最低水位 <b>${big(wl.minLevel)}</b>（${wl.minMonth} 末）${wl.weekMin ? `，逐周最低 <b>${big(wl.weekMin.v)}</b>（${wl.weekMin.m} 第 ${wl.weekMin.w} 周）` : ''}。`}
        ${wl.breachMonth ? `<b class="out">预计 ${wl.breachMonth} 末跌破安全线</b>，建议提前安排融资或压缩支出。`
          : (wl.minLevel == null ? '' : '未来三个月各月末水位均在安全线之上。')}
        ${wl.extrapolated ? '<br><b>提示：</b>标注「历史外推」的月份没有已审批计划，按近 3 个月实际净流入外推，仅供预警参考；计划审批后自动切换为计划口径。' : ''}
      </div>
    </div>`;
  })()}

  ${restrictedCard(info.name || e, e)}

  <div class="card" style="margin-bottom:12px"><h3>逐月收支结构瀑布 <span>期初 → 按二级科目 → 期末</span></h3>
    ${items.length ? svgWaterfall(startBal.total, items, endBal.total) : '<div class="empty">本期无流水</div>'}
    <div class="note">期初 ${big(startBal.total)} 元 → 期末 ${big(endBal.total)} 元。
      ${(startBal.missing || []).length || (endBal.missing || []).length ? `<b>汇率缺失：</b>${esc(Array.from(new Set((startBal.missing || []).concat(endBal.missing || []))).join('、'))}，其账户未计入合计。` : ''}</div>
  </div>

  <div class="grid g2">
    <div class="card"><h3>收支结构 · 按活动类型 <span>经营 / 投资 / 筹资</span></h3>
      ${byAct.length ? svgPair(byAct) : '<div class="empty">无数据</div>'}</div>
    <div class="card"><h3>科目结构 Top10 <span>二级科目</span></h3>
      ${(() => {
        const m = Object.entries(grp(all, r => (r.l2 || '未分类'))).map(([k, v]) => { const g = agg(v); return { name: k, a: g.inflow, b: g.outflow }; }).sort((x, y) => (y.a + y.b) - (x.a + x.b)).slice(0, 10);
        return m.length ? svgPair(m) : '<div class="empty">无数据</div>';
      })()}</div>
  </div>

  <div class="grid g2">
    <div class="card"><h3>账户余额 <span>${esc(e)} · 可用 = 余额 − 自动受限 − 人工补录</span></h3>

        ${acc.map(o => `<tr><td>${esc(o.bank)}</td><td class="mono">${esc(o.account || '待补登')}</td>
          <td class="num">${o.balance == null ? '—' : yuan2(o.balance)}</td>
          <td class="num ${o.autoRestricted ? 'out' : 'sub'}">${o.autoRestricted ? yuan2(o.autoRestricted) : '—'}</td>
          <td class="num">${o.available == null ? '—' : yuan2(o.available)}</td>
          <td class="mini">${esc(o.date || '—')}</td></tr>`).join('')}
        <tr class="total"><td colspan="2">合计</td><td class="num">${yuan2(acc.reduce((s, o) => s + (o.balance || 0), 0))}</td><td class="num">${yuan2(acc.reduce((s, o) => s + (o.autoRestricted || 0), 0))}</td><td class="num">${yuan2(acc.reduce((s, o) => s + (o.available || 0), 0))}</td><td></td></tr>
      </tbody></table>` : '<div class="empty">无账户</div>'}</div>
    <div class="card"><h3>本期计划 <span>${PERIOD_LABEL(S.period)}</span></h3>
      ${(() => {
        const ps = plans().filter(p => p.entity === e);
        if (!ps.length) return '<div class="empty"><div class="t">本期没有已审批计划</div>到「资金计划编制」提交并审批后参与预实。</div>';
        const pa = { in: ps.filter(p => p.direction === '流入').reduce((s, p) => s + p.amount, 0), out: ps.filter(p => p.direction === '流出').reduce((s, p) => s + p.amount, 0) };
        return `<table class="tbl"><thead><tr><th>方向</th><th>科目</th><th class="num">金额</th></tr></thead><tbody>
          ${ps.slice(0, 12).map(p => `<tr><td>${p.direction}</td><td>${esc(p.l2)}</td><td class="num">${yuan(p.amount)}</td></tr>`).join('')}
          <tr class="total"><td colspan="2">合计</td><td class="num">流入 ${big(pa.in)} / 流出 ${big(pa.out)}</td></tr></tbody></table>`;
      })()}</div>
  </div>`;
}
function shiftMonth(m, delta) {
  const d = new Date(m + '-01'); d.setMonth(d.getMonth() + delta);
  return d.toISOString().slice(0, 7) + '-01';
}

  if (x.status === 'confirmed') return '<span class="chip matched">已确认</span>';

  return `<span class="chip pending">待确认${x.n_pending ? ` ${x.n_pending} 笔` : ''}</span>`;
}

      : ready ? `<div class="note" style="margin-top:8px">当前申请：<b>${esc(b.entity)} · ${esc(b.period)}</b>（同期同文件指纹重复导入会被拦截）</div>`

    ${S.err ? `<div class="banner warn" style="margin-top:10px"><span class="ic">✗</span><div>${esc(S.err)}</div></div>` : ''}
  </div>`;

  if (step === 2) {
    const all = S.pendingRows || [];                 // 本批全部记录（含已确认）
    const batchConfirmed = b.status === 'confirmed';
    const filter = S.flowFilter || 'un';             // un 未识别 / id 已识别 / all 全部
    // 以「当前选择」实时判断是否已识别（下拉一选即生效，不必先保存才能点亮按钮）
    const pickOf = r => {
      const p = S.pick[r.id];
      return p ? { code: p.code || '', l1: p.l1 } : { code: r.code || '', l1: '' };
    };
    const ident = r => !!String(pickOf(r).code || '').trim();
    const list = all.filter(r => filter === 'all' ? true : filter === 'id' ? ident(r) : !ident(r));
    const nId = all.filter(ident).length, nUn = all.length - nId;
    const nTodo = all.filter(r => ident(r) && r.status !== 'confirmed').length;
    const l1OfRow = r => { const p = pickOf(r); const s = p.code ? smByCode(p.code) : null; return (s && s.l1) || p.l1 || '经营活动'; };
    const chips = [['un', `未识别 ${nUn}`], ['id', `已识别 ${nId}`], ['all', `全部 ${all.length}`]];
    return head + `
    <div class="card">
      <h3>② 人工识别 <span>${esc(b.entity)} · 批次 #${b.seq || b.id || '—'} · ${batchConfirmed ? '已确认（申请只读）' : esc(b.status || 'parsed')}</span></h3>
      ${batchConfirmed ? `<div class="banner ok"><span class="ic">✓</span><div>本批已确认并写入数仓${b.confirmed_at || b.updated_at ? `（${esc(String(b.confirmed_at || b.updated_at).slice(0, 19))}）` : ''}。申请层面只读；如需改数，请到下方「已确认记录」点<b>修改</b>——改后自动置「未确认（已修改）」，重新确认才更新看板。${all.filter(r => r.status !== 'confirmed').length ? ` 仍有 <b>${all.filter(r => r.status !== 'confirmed').length}</b> 笔未识别，指定科目后点「保存」再「全部确认」即可。` : ''}</div></div>` : ''}
      <div class="note" style="margin-top:0">「全部确认」= 本批所有<b>已识别</b>记录一次性置 confirmed（不受下方筛选影响）；未识别记录保持待确认，不进入看板实际数。</div>
      <div class="bar-actions">
        <div class="chips">
          ${chips.map(([k, label]) => `<button class="chipbtn ${filter === k ? 'on' : ''}" data-act="flow-filter" data-f="${k}">${label}</button>`).join('')}
        </div>
        <div class="spacer"></div>
        <span class="mini" data-flow-sum>本批 ${all.length} 笔 · 已确认 ${all.filter(r => r.status === 'confirmed').length} 笔 · 待确认 ${all.filter(r => r.status !== 'confirmed').length} 笔</span>
      </div>
      ${list.length ? `
      <div class="scroll tall"><table class="tbl"><thead><tr>
        <th>记录时间</th><th>银行</th><th>对方 / 摘要</th><th class="num">金额</th><th>方向</th>
        <th style="width:112px">一级科目</th><th style="width:200px">二级科目</th><th>状态</th></tr></thead><tbody>
        ${list.slice(0, 600).map(r => {
      const p = pickOf(r), l1 = l1OfRow(r);
      const subs = SUB_OPTS(l1).filter(s => l1 === '内部往来' || s.direction === r.direction || s.direction === '双向');
      return `<tr class="${r.status === 'confirmed' ? '' : r.modified ? 'picked' : ''}">
          <td class="r">${esc(r.txn_date)}${r.txn_time ? `<div class="mini">${esc(r.txn_time)}</div>` : ''}</td>
          <td class="sub">${esc(r.bank || '—')}</td>
          <td><div>${esc(r.counterparty || '—')}</div><div class="sub">${esc((r.memo || '').slice(0, 26))}</div></td>
          <td class="num ${r.direction === '收' ? 'in' : 'out'}">${r.direction === '收' ? '+' : '−'}${yuan(r.amount)}</td>
          <td>${r.direction === '收' ? '流入' : '流出'}</td>
          <td><select class="subj" data-l1="${r.id}">
            <option value="">未指定…</option>
            ${L1_LIST.map(x => `<option value="${x}" ${l1 === x ? 'selected' : ''}>${L1_SHORT[x]}</option>`).join('')}
          </select></td>
          <td><select class="subj" data-code="${r.id}">
            <option value="">${l1 ? '未指定…' : '先选一级科目…'}</option>
            ${subs.map(s => `<option value="${s.code}" ${p.code && (smByCode(p.code) || {}).l2 === s.l2 ? 'selected' : ''}>${esc(s.l2)}</option>`).join('')}
          </select></td>
          <td>${r.status === 'confirmed'
          ? '<span class="chip matched">已确认</span>'
          : r.modified ? '<span class="chip pending">未确认（已修改）</span>'
            : (ident(r) ? '<span class="chip">已识别 · 待确认</span>' : '<span class="chip pending">未识别</span>')}</td></tr>`;
    }).join('')}
      </tbody></table></div>` : `<div class="empty"><div class="t">${filter === 'un' ? '本批没有未识别记录' : filter === 'id' ? '本批还没有已识别记录' : '本批没有记录'}</div>
        ${filter === 'un' ? '全部记录都已指定科目，可直接「全部确认」。' : '切换上方筛选查看其他记录。'}</div>`}
      <div class="flexrow" style="margin-top:10px">
        <button class="btn ghost" data-act="flow-save">保存</button>
        <button class="btn ${nTodo ? '' : 'off'}" data-act="confirm-batch" ${nTodo ? '' : 'disabled'}>全部确认（已识别 ${nTodo} 笔）</button>
        <button class="btn ghost" data-act="step" data-step="1">← 返回申请</button>
        <button class="btn ghost" data-act="new-application">新建申请</button>
        <div class="spacer"></div>
        <span class="mini">保存 = 写入数仓但不进看板（仍为未确认）；全部确认 = 已识别记录整批确认并刷新看板</span>
      </div>
    </div>

    <div class="card">
      <h3>已确认记录 <span>可单条修改，修改后置「未确认（已修改）」</span></h3>
      <div class="scroll"><table class="tbl"><thead><tr><th>记录时间</th><th>银行</th><th>对方</th><th class="num">金额</th><th>一级</th><th>二级</th><th>来源</th><th></th></tr></thead><tbody>
        ${(S.confirmedRows || []).slice(0, 80).map(r => `<tr>
          <td class="r">${esc(r.txn_date)}</td><td class="sub">${esc(r.bank || '')}</td><td>${esc((r.counterparty || '—').slice(0, 16))}</td>
          <td class="num">${yuan(r.amount)}</td><td class="sub">${esc(L1_SHORT[l1Of(r)] || l1Of(r) || '')}</td><td class="sub">${esc(r.l2 || '')}</td>
          <td>${r.matched_by === 'manual' ? '<span class="chip manual">人工</span>' : '<span class="chip matched">规则</span>'}</td>
          <td><button class="btn ghost sm" data-act="edit-flow" data-id="${r.id}">修改</button></td></tr>`).join('') || '<tr><td colspan="8" class="empty">暂无</td></tr>'}
      </tbody></table></div>
    </div>`;
  }

  const bs = S.meta.batches || [];
  // 文件名：优先本次选择，其次从已落库批次回捞（刷新页面后仍在）
  const curBatch = b.id ? (S.meta.batches || []).find(x => x.id === b.id) : null;
  const fname = b.file || (curBatch && curBatch.file_name) || '';
  return head + `
  <div class="card">
    <h3>解析校验结果 <span>${fname ? esc(fname) : '尚未选择文件'}${fname && curBatch ? `　·　批次 #${curBatch.seq || curBatch.id}` : ''}</span></h3>
    ${S.parse ? `
      <div class="kv" style="font-size:12px;max-width:460px">
        <div class="k">文件行数</div><div class="v">${S.parse.total} 行</div>
        <div class="k">可用于入库</div><div class="v">${S.parse.rows.length} 笔</div>
        <div class="k">文件内重复</div><div class="v">${(S.parse.dupInFile || []).length} 笔</div>
        <div class="k">规则命中</div><div class="v">${S.parse.hit || 0} 笔（其余进待确认）</div>
        <div class="k">重复跳过（库内已有）</div><div class="v">${S.parse.dup || 0} 笔${S.parse.repaired ? `（其中 ${S.parse.repaired} 笔补全了对方户名/账号）` : ''}</div>
        <div class="k">超出期间（已跳过）</div><div class="v">${S.parse.outPeriod || 0} 笔${(S.parse.outMonths || []).length ? `（${S.parse.outMonths.map(m => m).join('、')}）` : ''}</div>
      </div>
      ${(S.parse.dupRows || []).length ? `<div class="note"><b>库内重复（已跳过）：</b>${S.parse.dupRows.slice(0, 8).map(d => `第 ${d.row} 行 ${d.date} ${yuan(d.amount)}`).join('；')}${S.parse.dupRows.length > 8 ? ' …' : ''}</div>` : ''}
      ${(S.parse.dupInFile || []).length ? `<div class="note"><b>文件内重复（已标记）：</b>${S.parse.dupInFile.slice(0, 6).map(d => `第 ${d.row} 行 与第 ${d.first} 行相同`).join('；')}</div>` : ''}
      <div class="flexrow" style="margin-top:10px">
        <button class="btn" data-act="step" data-step="2">${curBatch && curBatch.status === 'confirmed' ? '查看本批记录（已确认）' : `下一步：人工识别（${curBatch ? curBatch.n_pending : (S.meta.counts.pending + S.meta.counts.draft)} 笔待处理）`} →</button>
        <span class="mini">已逐笔落库：命中规则=已确认，未命中=待确认</span>
      </div>` : curBatch ? `
      <div class="kv" style="font-size:12px;max-width:460px">
        <div class="k">文件行数</div><div class="v">${curBatch.n_rows} 行</div>
        <div class="k">已确认</div><div class="v">${curBatch.n_confirmed} 笔</div>
        <div class="k">待确认</div><div class="v">${curBatch.n_pending} 笔</div>
        <div class="k">批次状态</div><div class="v">${esc(curBatch.status)}</div>
      </div>
      <div class="flexrow" style="margin-top:10px">
        <button class="btn" data-act="step" data-step="2">下一步：人工识别（${curBatch.n_pending} 笔待处理）→</button>
        <span class="mini">该批已落库，可直接继续识别或修改</span>
      </div>` : `<div class="empty"><div class="t">选择文件后自动解析</div>表头缺列会阻断入库并提示具体缺失项；重复行按「公司+账户+日期+方向+金额+摘要+对手+行序」判定。</div>`}
  </div>

  <div class="card">
    <h3>批次列表 <span>申请 → 解析 → 识别 → 关闭</span></h3>
    <div class="flexrow" style="justify-content:flex-end;margin:-28px 0 8px"><button class="btn ghost sm" data-act="reset-data">清空业务数据（保留主数据）</button></div>
    <div class="scroll"><table class="tbl"><thead><tr><th>批次</th><th>公司</th><th>期间</th><th>文件</th><th>状态</th><th>申请人</th><th>创建时间</th><th>最后操作时间</th><th>操作</th></tr></thead><tbody>
      ${bs.map(x => `<tr>
        <td>#${x.seq || x.id}</td><td>${esc(x.entity)}</td><td>${esc(x.period)}</td><td class="sub">${esc((x.file_name || '').slice(0, 24))}</td>
        <td>${batchChip(x)}</td>
        <td class="sub">${esc(x.operator || '—')}</td>
        <td class="mini">${esc(String(x.created_at || '').slice(0, 16))}</td>
        <td class="mini">${esc(String(x.updated_at || x.confirmed_at || x.created_at || '').slice(0, 16))}</td>
        <td><div class="flexrow" style="gap:6px">${x.status === 'confirmed'
        ? `<button class="btn ghost sm" data-act="open-batch" data-id="${x.id}">查看</button>
           <button class="btn ghost sm" data-act="flow-change" data-id="${x.id}" title="复制一份新的申请重新识别，确认后本批退出看板">发起变更</button>`
        : x.status === 'superseded' ? `<button class="btn ghost sm" data-act="open-batch" data-id="${x.id}">查看</button><span class="mini">已被变更</span>`
          : `<button class="btn ghost sm" data-act="open-batch" data-id="${x.id}">继续处理</button>`}</div></td></tr>`).join('') || '<tr><td colspan="9" class="empty">暂无批次</td></tr>'}
    </tbody></table></div>
  </div>`;
}
function periodListRaw() {
  const ms = [];
  const y = (S.snap && S.snap.end ? S.snap.end : '2026-01').slice(0, 4);
  for (let m = 1; m <= 12; m++) ms.push(`${y}-${String(m).padStart(2, '0')}`);
  return ms.reverse();
}

/* ---------- 2.2 资金计划 ---------- */
const PLAN_CHIP = st => ({
  parsed: '<span class="chip">可编辑</span>',
  submitted: '<span class="chip pending">审批中</span>',
  approved: '<span class="chip matched">已审批 · 已入库</span>',
  superseded: '<span class="chip">历史版本</span>',
  rejected: '<span class="chip pending">已驳回</span>',
  withdrawn: '<span class="chip">已撤回</span>'
}[st] || `<span class="chip">${esc(st || '—')}</span>`);
const PLAN_ST_CN = { parsed: '可编辑', submitted: '审批中', approved: '已审批 · 已入库', superseded: '历史版本', rejected: '已驳回', withdrawn: '已撤回（不可编辑）' };

function planActions(x) {
  const view = `<button class="btn ghost sm" data-act="plan-open-batch" data-id="${x.id}" title="载入该批次明细查看">查看</button>`;
  if (x.status === 'parsed') return `<div class="flexrow" style="gap:6px">${view}<button class="btn sm" data-act="plan-submit-batch" data-id="${x.id}">提交审批</button></div>`;
  if (x.status === 'submitted') return `<div class="flexrow" style="gap:6px">${view}
    <button class="btn sm" data-act="plan-approve" data-id="${x.id}">审批通过</button>
    <button class="btn ghost sm" data-act="plan-reject" data-id="${x.id}">驳回</button>
    <button class="btn ghost sm" data-act="plan-withdraw" data-id="${x.id}">撤回</button></div>`;
  if (x.status === 'approved') return `<div class="flexrow" style="gap:6px">${view}<button class="btn ghost sm" data-act="plan-withdraw" data-id="${x.id}" title="撤回后该版本退出预实，可重新导入覆盖">撤回</button></div>`;
  if (x.status === 'withdrawn') return `<div class="flexrow" style="gap:6px">${view}<span class="mini">已撤回</span></div>`;
  return `<div class="flexrow" style="gap:6px">${view}<span class="mini">—</span></div>`;
}

function panePlan() {
  const pb = S.planBatch;
  const ready = pb.entity && pb.period;
  const bs = S.meta.planBatches || [];
  const cur = pb.id ? bs.find(x => Number(x.id) === Number(pb.id)) : null;
  const st = cur ? cur.status : '';
  const editable = !cur || st === 'parsed';
  return `
  <div class="pane-title"><h2>资金计划编制</h2><span>申请（公司+期间）→ 模板校验映射 → 提交审批 → 审批通过后入数仓 → 预实同步</span></div>
  ${stepper(cur ? 2 : 1, ['申请与上传', '校验与提交审批'])}
  <div class="card" style="margin-bottom:12px">
    <h3>① 计划申请 <span>未审批的计划不参与预实${cur ? ` · 批次 #${cur.seq || cur.id} · ${PLAN_ST_CN[st] || st}` : ''}</span></h3>
    <div class="flexrow">
      <div class="field"><label>公司 *</label><select id="p-entity" ${editable ? '' : 'disabled'}><option value="">请选择公司…</option>${E().map(e => `<option value="${esc(e.short)}" ${pb.entity === e.short ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select></div>
      <div class="field"><label>期间 *</label><input type="date" id="p-period" value="${pb.period && /^\d{4}-\d{2}$/.test(pb.period) ? pb.period + '-01' : ''}" style="min-width:160px" ${editable ? '' : 'disabled'}></div>
      <div class="field"><label>申请人</label><input id="p-applicant" value="${esc(pb.applicant || localStorage.getItem('v11.applicant') || opName())}" style="min-width:110px" ${editable ? '' : 'disabled'}></div>
      <div class="spacer"></div>
      <button class="btn ghost" data-act="dl-template">下载模板（源文件）</button>
      <button class="btn ${ready && editable ? '' : 'off'}" data-act="pickPlan" ${ready && editable ? '' : 'disabled'}>上传计划表</button>
      <input type="file" id="filePlan" accept=".xlsx,.xls,.csv" class="hide">
    </div>
    ${ready ? '' : '<div class="banner info" style="margin:10px 0 0"><span class="ic">i</span><div>先选公司与期间；计划期间决定预实对比口径。</div></div>'}
    ${cur && st === 'submitted' ? `<div class="banner info" style="margin:10px 0 0"><span class="ic">i</span><div>批次 #${cur.seq || cur.id} 审批中不可直接改，需先「撤回」；下方按钮可操作。</div></div>` : ''}
    ${cur && st === 'withdrawn' ? `<div class="banner info" style="margin:10px 0 0"><span class="ic">i</span><div>批次 #${cur.seq || cur.id} 已撤回且不可编辑（不参与预实），如需计划请重新建申请并上传。</div></div>` : ''}
  </div>

  ${pb.rows.length ? `
  <div class="card" style="margin-bottom:12px">
    <h3>② 校验与提交 <span>${pb.rows.length} 行 · ${esc(pb.file)}${cur ? ` · #${cur.seq || cur.id} ${PLAN_ST_CN[st] || st}` : ''}</span></h3>
    ${(pb.issues || []).length
      ? `<div class="banner warn" style="margin-bottom:8px"><span class="ic">⚠</span><div>${pb.issues.map(esc).join('<br>')}</div></div>`
      : `<div class="banner ok" style="margin-bottom:8px"><span class="ic">✓</span><div>模板字段与科目映射校验通过${cur ? (st === 'approved' ? '，已审批并入数仓，参与预实对比' : st === 'submitted' ? '，已提交审批（审批中不参与预实）' : st === 'superseded' ? '，历史版本，已被变更版覆盖，仅供查看' : '，已保存至数仓（计划草稿，未进预实）') : ''}。</div></div>`}
    <div class="scroll tall"><table class="tbl"><thead><tr><th>主体</th><th>方向</th><th>科目大类</th><th>二级科目</th><th class="num">金额</th><th>来源行</th></tr></thead><tbody>
      ${pb.rows.slice(0, 300).map(p => `<tr><td>${esc(p.entity)}</td><td>${p.direction}</td><td>${esc(L1_SHORT[p.l1] || p.l1)}</td><td>${esc(p.l2)}</td><td class="num">${yuan(p.amount)}</td><td class="mini">${esc(p.note || '')}</td></tr>`).join('')}
      <tr class="total"><td colspan="4">合计</td><td class="num">流入 ${big(pb.rows.filter(p => p.direction === '流入').reduce((s, p) => s + p.amount, 0))} / 流出 ${big(pb.rows.filter(p => p.direction === '流出').reduce((s, p) => s + p.amount, 0))}</td><td></td></tr>
    </tbody></table></div>
    <div class="flexrow" style="margin-top:10px">
      ${!cur ? `<button class="btn" data-act="plan-save">保存计划批次</button>` : ''}
      ${st === 'parsed' ? `<button class="btn" data-act="plan-submit-batch" data-id="${cur.id}">下一步：提交审批</button>` : ''}
      ${st === 'submitted' ? `<button class="btn" data-act="plan-approve" data-id="${cur.id}">审批通过（演示）</button>
        <button class="btn ghost" data-act="plan-withdraw" data-id="${cur.id}">撤回至编辑</button>
        <button class="btn ghost" data-act="plan-reject" data-id="${cur.id}">驳回</button>` : ''}
      ${st === 'approved' ? `<span class="chip matched">已审批并写入数仓</span><button class="btn ghost" data-act="plan-withdraw" data-id="${cur.id}">撤回至编辑（撤回后可重新导入覆盖）</button>` : ''}
      <button class="btn ghost" data-act="plan-drop">关闭本批</button>
      <div class="spacer"></div>
      <span class="mini">${st === 'parsed' ? '提交后进入审批中，可撤回；审批通过才写入计划口径' : st === 'approved' ? '已入库版本参与预实；如需修改，先「撤回」再重新导入覆盖' : ''}</span>
    </div>
  </div>` : ''}

  <div class="card">
    <h3>计划批次 <span>审批通过才参与预实 · 已审批需撤回后重新导入</span></h3>
    <div class="scroll"><table class="tbl"><thead><tr><th>批次</th><th>公司</th><th>期间</th><th>申请人</th><th>状态</th><th>最后操作时间</th><th>操作</th></tr></thead><tbody>
      ${bs.map(x => `<tr>
        <td>#${x.seq || x.id}</td><td>${esc(x.entity)}</td><td>${esc(x.period)}</td>
        <td class="sub">${esc(x.operator || '—')}</td>
        <td>${PLAN_CHIP(x.status)}</td>
        <td class="mini">${esc(String(x.updated_at || x.approved_at || x.created_at || '').slice(0, 16))}</td>
        <td>${planActions(x)}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">暂无计划批次</td></tr>'}
    </tbody></table></div>
    <div class="note">状态：可编辑 → 审批中（可撤回）→ 已审批（入数仓）。已审批要改必须「撤回」（该版本立即退出预实），再重新导入覆盖同一批次、重新提交审批；系统不生成新版本。</div>
  </div>`;
}

/* ---------- 3.1 资金穿透（活动类型 → 收支分类 → 三级穿透明细） ---------- */
function svgPlanActual(months, acts, plans, w) {
  w = w || 640; const h = 240, pl = 52, pr = 12, pt = 26, pb = 34;
  const iw = w - pl - pr, ih = h - pt - pb;
  const max = Math.max(1, ...acts.map(Math.abs), ...plans.map(Math.abs));
  const step = iw / Math.max(months.length, 1), bw = Math.min(12, step / 3.6);
  const zero = pt + ih / 2, sc = (ih / 2) / max;
  const y = v => zero - v * sc;
  let g = '', lab = '', bars = '', xl = '';
  for (let i = 0; i <= 4; i++) {
    const v = max * (i - 2) / 2, yy = y(v);
    g += `<line x1="${pl}" y1="${yy}" x2="${w - pr}" y2="${yy}" stroke="${v === 0 ? '#D8DEE9' : '#EDF0F5'}"/>`;
    lab += `<text x="${pl - 8}" y="${yy + 3.5}" text-anchor="end" font-size="10" fill="#9CA3AF">${big(v)}</text>`;
  }
  months.forEach((m, i) => {
    const cx = pl + step * i + step / 2;
    const draw = (v, dx, color) => {
      const y0 = y(Math.max(0, v)), y1 = y(Math.min(0, v));
      bars += `<rect x="${cx + dx}" y="${y0}" width="${bw}" height="${Math.max(1, y1 - y0)}" fill="${color}" rx="1"/>`;
      // 柱顶/柱底金额 label（月份过多时省略，避免重叠）
      if (v && months.length <= 8) {
        const ty = v > 0 ? y0 - 4 : y1 + 11;
        bars += `<text x="${cx + dx + bw / 2}" y="${ty}" text-anchor="middle" font-size="9" fill="${color}">${big(v)}</text>`;
      }
    };
    draw(acts[i], -bw - 1, '#1F3864');
    draw(plans[i], 1, '#C9A227');
    xl += `<text x="${cx}" y="${h - 10}" text-anchor="middle" font-size="10" fill="#6B7280">${Number(m.slice(5))}月</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${g}${lab}${bars}${xl}</svg>
    <div class="legend"><span><i style="background:#1F3864"></i>实际</span><span><i style="background:#C9A227"></i>计划</span></div>`;
}

function paneDrill() {
  const all = rows(), allPlans = plans();
  const ACTS0 = Array.from(new Set(SUBMAP().map(s => s.l1)));
  const ACTS = L1_LIST.filter(x => ACTS0.includes(x)).concat(ACTS0.filter(x => !L1_LIST.includes(x)));
  const act = (S.drillAct && ACTS.includes(S.drillAct)) ? S.drillAct
    : (ACTS.includes('经营活动') ? '经营活动' : (ACTS[0] || '经营活动'));
  const subs = Array.from(new Map(SUBMAP().filter(s => s.l1 === act)
    .sort((a, b) => (a.sort || 0) - (b.sort || 0) || String(a.code).localeCompare(String(b.code)))
    .map(s => [s.l2, s])).values());
  const cat = S.drillCat || '';
  const srcSel = S.drillSrc || '';
  const dir = S.drillDir2 || 'both';
  const month = 'ALL';   // 时间口径统一由页面顶部「期间」决定，下钻层不再单独筛月份
  const thr = Number(S.drillAmt || 0);
  const months = (S.snap && S.snap.allMonths) ? S.snap.allMonths : [];

  // 实际：与「收支明细 / 预实分析」同口径 —— 只认已确认流水，金额折人民币

  const actRows = all.filter(r => (r.l1 || l1Of(r)) === act && (!cat || l2Of(r) === cat))
    .map(r => ({
      date: r.txn_date || '', period: (r.txn_date || '').slice(0, 7), dir: r.direction,
      cat: l2Of(r), cp: r.counterparty || '', l1: r.l1 || l1Of(r), amt: cny(r)
    }));
  // 计划：已审批计划明细
  const planRows = allPlans.filter(x => x.l1 === act && (!cat || (x.l2 || '未分类') === cat))
    .map(x => ({
      date: x.period || '', period: x.period || '', dir: x.direction === '流入' ? '收' : '支',
      cat: x.l2 || '未分类', cp: '', l1: x.l1, amt: Number(x.amount || 0)
    }));
  // 数据源：未手动选择时，只有计划、没有已确认流水的公司自动展示计划（避免看起来「没数据」）
  const src = srcSel === 'plan' ? 'plan' : srcSel === 'actual' ? 'actual'
    : ((!actRows.length && planRows.length) ? 'plan' : 'actual');
  const autoPlan = !srcSel && src === 'plan';
  const base = src === 'plan' ? planRows : actRows;
  const list = base.filter(r => (month === 'ALL' || r.period === month)
    && (dir === 'both' || r.dir === dir) && Math.abs(r.amt) >= thr)
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  const sum = f => list.filter(f).reduce((s, r) => s + r.amt, 0);
  const cnt = f => list.filter(f).length;
  const inAmt = sum(r => r.dir === '收'), outAmt = sum(r => r.dir === '支');
  const maxAmt = Math.max(1, ...base.map(r => Math.abs(r.amt)));

  const monthList = months.length ? months
    : Array.from(new Set([].concat(actRows.map(r => r.period), planRows.map(r => r.period)))).filter(Boolean).sort();
  const aSeries = monthList.map(m => actRows.filter(r => r.period === m).reduce((s, r) => s + (r.dir === '收' ? r.amt : -r.amt), 0));
  const pSeries = monthList.map(m => planRows.filter(r => r.period === m).reduce((s, r) => s + (r.dir === '收' ? r.amt : -r.amt), 0));
  const sumA = aSeries.reduce((s, v) => s + v, 0), sumP = pSeries.reduce((s, v) => s + v, 0);
  const lab = m => Number(m.slice(5)) + '月';
  const aMonths = Array.from(new Set(actRows.map(r => r.period))).sort();
  const pMonths = Array.from(new Set(planRows.map(r => r.period))).sort();

  const srcRows = src === 'plan' ? planRows : actRows;
  const catChips = [{ l2: '', amt: srcRows.reduce((s, r) => s + Math.abs(r.amt), 0) }]
    .concat(subs.map(s => ({

      amt: srcRows.filter(r => r.cat === s.l2).reduce((a, r) => a + Math.abs(r.amt), 0)
    })));
  const catTitle = cat || '全部收支';

  return `
