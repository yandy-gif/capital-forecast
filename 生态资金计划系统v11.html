/* ---------- 3.2 预实分析 ---------- */
/* 科目偏差：横向双向条（正=实际>计划 深蓝，负=实际<计划 砖红） */
function svgDevBar(items, w) {
  w = w || 620;
  const arr = (items || []).filter(x => x.plan).sort((a, b) => Math.abs(b.dev || 0) - Math.abs(a.dev || 0)).slice(0, 12);
  if (!arr.length) return '<div class="empty">没有可比科目<div class="t">需先有已审批计划，且实际落在计划月份</div></div>';
  const rowH = 28, labW = 118, right = 70, top = 12, bot = 24;
  const h = top + arr.length * rowH + bot;
  const halfW = Math.max(40, (w - labW - right) / 2);
  const zeroX = labW + halfW;
  const max = Math.max(1, ...arr.map(x => Math.abs(x.dev || 0)));
  const sc = (halfW - 8) / max;
  let g = '';
  arr.forEach((x, i) => { if (i % 2 === 0) g += '<rect x="' + (labW - 6) + '" y="' + (top + i * rowH) + '" width="' + (halfW * 2 + 12) + '" height="' + rowH + '" fill="#FAFBFE"/>'; });
  arr.forEach((x, i) => {
    const y = top + i * rowH, v = x.dev || 0, len = Math.abs(v) * sc;
    const pos = v >= 0, x0 = pos ? zeroX : zeroX - len;
    const rate = x.rate == null ? '—' : pctTxt(x.rate);
    const tip = (x.l2 || '未分类') + '｜计划 ' + big(x.plan) + '｜实际 ' + big(x.act) + '｜偏差 ' + (pos ? '+' : '−') + big(Math.abs(v)) + '（' + rate + '）';
    g += '<text x="' + (labW - 12) + '" y="' + (y + 18) + '" text-anchor="end" font-size="11" fill="#374151">' + esc((x.l2 || '未分类').slice(0, 10)) + '</text>';
    g += '<rect x="' + x0 + '" y="' + (y + 7) + '" width="' + Math.max(2, len) + '" height="15" rx="3" fill="' + (pos ? '#1F3864' : '#C0504D') + '"><title>' + esc(tip) + '</title></rect>';
    g += '<text x="' + (pos ? x0 + len + 7 : x0 - 7) + '" y="' + (y + 18) + '" text-anchor="' + (pos ? 'start' : 'end') + '" font-size="10.5" fill="' + (pos ? '#1F3864' : '#C0504D') + '">' + (pos ? '+' : '−') + big(Math.abs(v)) + '</text>';
  });
  g += '<line x1="' + zeroX + '" y1="' + (top - 2) + '" x2="' + zeroX + '" y2="' + (top + arr.length * rowH + 2) + '" stroke="#C7CFDB"/>';
  g += '<text x="' + (zeroX - halfW + 8) + '" y="' + (h - 7) + '" text-anchor="start" font-size="9.5" fill="#9CA3AF">−' + big(max) + '</text>';
  g += '<text x="' + (zeroX + halfW - 8) + '" y="' + (h - 7) + '" text-anchor="end" font-size="9.5" fill="#9CA3AF">+' + big(max) + '</text>';
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;display:block">' + g + '</svg>' +
    '<div class="legend"><span><i style="background:#1F3864"></i>实际 &gt; 计划</span><span><i style="background:#C0504D"></i>实际 &lt; 计划</span><span class="mini">仅可比科目 · 按绝对偏差排序，最多 12 项</span></div>';
}

/* 偏差贡献度 Top5：竖向柱状 */
function svgTopDev(items, w) {
  w = w || 438;
  const arr = (items || []).filter(x => x.plan).sort((a, b) => Math.abs(b.dev || 0) - Math.abs(a.dev || 0)).slice(0, 5);
  const h = 232, pl = 46, pr = 10, pt = 26, pb = 58;
  if (!arr.length) return '<div class="empty">无计划科目<div class="t">审批计划后自动生成</div></div>';
  const iw = w - pl - pr, ih = h - pt - pb;
  const max = Math.max(1, ...arr.map(x => Math.abs(x.dev || 0)));
  const step = iw / arr.length, bw = Math.min(46, step * 0.52);
  const zero = pt + ih / 2, sc = (ih / 2) / max;
  let g = '', xl = '';
  for (let i = 0; i <= 4; i++) {
    const v = max * (i - 2) / 2, yy = zero - v * sc;
    g += '<line x1="' + pl + '" y1="' + yy + '" x2="' + (w - pr) + '" y2="' + yy + '" stroke="' + (v === 0 ? '#C7CFDB' : '#EDF0F5') + '"/>';
    g += '<text x="' + (pl - 8) + '" y="' + (yy + 3.5) + '" text-anchor="end" font-size="9.5" fill="#9CA3AF">' + (v > 0 ? '+' : v < 0 ? '−' : '') + big(Math.abs(v)) + '</text>';
  }
  arr.forEach((x, i) => {
    const cx = pl + step * i + step / 2, v = x.dev || 0;
    const y0 = zero - Math.max(0, v) * sc, y1 = zero - Math.min(0, v) * sc;
    const tip = (x.l2 || '未分类') + '｜计划 ' + big(x.plan) + '｜实际 ' + big(x.act) + '｜偏差 ' + (v >= 0 ? '+' : '−') + big(Math.abs(v)) + '（' + pctTxt(x.rate) + '）';
    g += '<rect x="' + (cx - bw / 2) + '" y="' + y0 + '" width="' + bw + '" height="' + Math.max(2, y1 - y0) + '" rx="3" fill="' + (v >= 0 ? '#2E5C9A' : '#C0504D') + '"><title>' + esc(tip) + '</title></rect>';
    g += '<text x="' + cx + '" y="' + (v >= 0 ? y0 - 6 : y1 + 13) + '" text-anchor="middle" font-size="10.5" fill="' + (v >= 0 ? '#1F3864' : '#C0504D') + '">' + (v >= 0 ? '+' : '−') + big(Math.abs(v)) + '</text>';
    const nm = String(x.l2 || '未分类');
    const cut = nm.length > 5 ? Math.min(5, Math.ceil(nm.length * 0.6)) : nm.length;
    const a = nm.slice(0, cut), b = nm.slice(cut, cut + 5);
    xl += '<text x="' + cx + '" y="' + (h - 34) + '" text-anchor="middle" font-size="10" fill="#4B5563">' + esc(a) + (b ? '<tspan x="' + cx + '" dy="13">' + esc(b) + '</tspan>' : '') + '</text>';
  });
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;display:block">' + g + xl + '</svg>' +
    '<div class="legend"><span><i style="background:#2E5C9A"></i>偏差为正（超计划）</span><span><i style="background:#C0504D"></i>偏差为负（欠计划）</span><span class="mini">悬停看计划/实际</span></div>';
}

const VA_GRAINS = { month: '按月', quarter: '按季度', cumulative: '累计' };

function vaPeriodComparison(periods, qualityBlocked) {
  const groups = new Map();
  for (const period of periods) {
    const { month } = period;
    const quarter = `${month.slice(0, 4)} Q${Math.ceil(Number(month.slice(5)) / 3)}`;
    const label = S.vaGrain === 'quarter' ? quarter : S.vaGrain === 'cumulative' ? '所选期间累计' : month;
    if (!groups.has(label)) groups.set(label, []);
    groups.get(label).push(period);
  }
  const totals = Array.from(groups, ([label, items]) => {
    const planned = items.filter(m => m.plan != null);
    const missing = planned.filter(m => m.actual == null);
    const actualMonths = planned.length ? planned : items;
    const plan = planned.length ? planned.reduce((sum, m) => sum + m.plan, 0) : null;
    const actual = !qualityBlocked && !missing.length && actualMonths.some(m => m.actual != null)
      ? actualMonths.reduce((sum, m) => sum + (m.actual ?? 0), 0) : null;
    const delta = plan != null && actual != null ? actual - plan : null;
    const rate = plan && delta != null ? delta / plan * 100 : null;
    const remarks = [];
    if (S.vaGrain === 'quarter' && items.length < 3) remarks.push('区间未覆盖完整季度');
    if (plan == null) remarks.push(actual == null ? '暂无已审批计划' : '暂无已审批计划，仅列实际');
    if (planned.length && planned.length < items.length) remarks.push(`仅计 ${planned.length}/${items.length} 个有计划月`);
    if (missing.length) remarks.push('缺少同期确认流水（' + missing.map(m => m.month).join('、') + '）');
    if (qualityBlocked) remarks.push('报告期间数据待核查');
    if (plan === 0 && actual != null) remarks.push('计划为 0，偏差率不可算');
    const first = items[0].month, last = items.at(-1).month;
    return { label, span: first === last ? first : `${first} 至 ${last}`, plan, actual, delta, rate, remarks };
  });
  const grainLabel = VA_GRAINS[S.vaGrain];
  const controls = Object.entries(VA_GRAINS).map(([key, label]) => `<button type="button" class="${key === S.vaGrain ? 'on' : ''}"
    data-act="va-grain" data-value="${key}" aria-pressed="${key === S.vaGrain}">${label}</button>`).join('');
  const contentWidth = Math.max(330, 80 + totals.length * 30);
  const hasValues = totals.some(t => t.plan != null || t.actual != null);
  const chart = hasValues ? `<div class="va-plot"><div style="min-width:${contentWidth}px">
    ${svgMonthlyChart(totals.map(t => t.label), [
      { label: '计划', color: 'var(--forecast)', values: totals.map(t => t.plan) },
      { label: '实际', color: 'var(--navy)', values: totals.map(t => t.actual) }
    ], { bars: true, title: grainLabel + '计划与实际对比', width: Math.max(540, contentWidth) })}
    </div></div><div class="legend"><span><i class="drill-plan-key"></i>计划</span><span><i class="drill-actual-key"></i>实际</span></div>`
    : '<div class="empty">所选期间暂无可绘制的计划或实际金额</div>';
  return `<section class="card dashboard-card va-comparison" aria-labelledby="va-period-title">
    <div class="dashboard-heading">
      <div><h3 id="va-period-title">计划与实际对比</h3><p>收支金额合计 · 人民币（元）</p></div>
      <div class="seg comparison-seg" role="group" aria-label="预实分析时间维度">${controls}</div>
    </div>
    ${chart}
    ${totals.length ? `<div class="scroll va-period-data" tabindex="0" role="region" aria-label="${grainLabel}预实对比数据">
      <table class="tbl va-period-table"><thead><tr><th scope="col">期间</th><th scope="col" class="num">计划</th><th scope="col" class="num">实际</th>
        <th scope="col" class="num">偏差额</th><th scope="col" class="num">偏差率</th><th scope="col">口径说明</th></tr></thead>
      <tbody>${totals.map(t => `<tr><th scope="row">${esc(t.label)}${t.span === t.label ? '' : `<div class="mini">${esc(t.span)}</div>`}</th>
        <td class="num">${yuan2(t.plan)}</td><td class="num">${yuan2(t.actual)}</td><td class="num">${yuan2(t.delta)}</td>
        <td class="num">${pctTxt(t.rate)}</td><td class="sub">${esc(t.remarks.join(' · '))}</td></tr>`).join('')}</tbody></table></div>` : ''}
    <div class="note">实际按有已审批计划的月份取数。偏差率 =（汇总实际 − 汇总计划）÷ 汇总计划。累计范围取自上方「期间」筛选。</div>
  </section>`;
}

function paneVA() {
  /* 与现金流量表同口径：内部往来整段剔除（标识取映射表） */
  const allRaw = rows(), psRaw = plans();
  const intRows = allRaw.filter(isInt), intAmt = intRows.reduce((s, r) => s + cny(r), 0);
  const all = allRaw.filter(r => !isInt(r));
  const ps = psRaw.filter(x => !x.is_internal);
  // 同期口径：只用「有计划的月份」里的实际流水做对比，避免拿 1-9 月实际比 10-12 月计划
  const pMonths = new Set(ps.map(x => x.period));
  const cmpRows = all.filter(r => pMonths.has(r.txn_date.slice(0, 7)));
  const a = agg(cmpRows);
  const p = { in: ps.filter(x => x.direction === '流入').reduce((s, x) => s + x.amount, 0), out: ps.filter(x => x.direction === '流出').reduce((s, x) => s + x.amount, 0) };
  const plansByMonth = grp(ps, x => x.period);
  const actualByMonth = grp(all, r => r.txn_date.slice(0, 7));
  const periods = [];
  for (const date = new Date(S.snap.start + '-01T00:00:00Z'); Number.isFinite(date.getTime()); date.setUTCMonth(date.getUTCMonth() + 1)) {
    const month = date.toISOString().slice(0, 7);
    if (!S.snap.end || month > S.snap.end) break;
    periods.push({
      month,
      plan: plansByMonth[month]?.reduce((sum, x) => sum + x.amount, 0) ?? null,
      actual: actualByMonth[month]?.reduce((sum, r) => sum + cny(r), 0) ?? null
    });
  }
  const missingMonths = Array.from(pMonths).filter(m => !actualByMonth[m]);
  const qualityBlocked = Boolean(S.snap.pending || (S.snap.missingFx || []).length);
  const comparable = ps.length > 0 && !missingMonths.length && !qualityBlocked;
  const byKey = new Map();
  cmpRows.forEach(r => { const k = r.l1 + '|' + (r.l2 || '未分类'); const o = byKey.get(k) || { l1: r.l1, l2: r.l2, plan: 0, actIn: 0, actOut: 0, nIn: 0, nOut: 0 }; if (r.direction === '收') { o.actIn += cny(r); o.nIn++; } else { o.actOut += cny(r); o.nOut++; } byKey.set(k, o); });
  ps.forEach(x => { const k = x.l1 + '|' + x.l2; const o = byKey.get(k) || { l1: x.l1, l2: x.l2, plan: 0, planIn: 0, planOut: 0, actIn: 0, actOut: 0, nIn: 0, nOut: 0 }; o.plan += x.amount; if (x.direction === '流入') o.planIn += x.amount; else o.planOut += x.amount; byKey.set(k, o); });
  const rowsVA = Array.from(byKey.values()).map(o => {
    const act = o.actIn + o.actOut;
    const dev = act - o.plan;
    const rate = o.plan ? dev / o.plan * 100 : null;
    const dirOut = o.plan ? (o.planOut > o.planIn) : (o.actOut > o.actIn);
    const unfav = o.plan ? (dirOut ? dev > 0 : dev < 0) : false;
    return Object.assign(o, { act, dev, rate, unfavist: unfav });
  }).sort((x, y) => Math.abs(y.dev) - Math.abs(x.dev));
  const totalPlan = p.in + p.out, totalAct = a.inflow + a.outflow;
  const totalRate = totalPlan ? (totalAct - totalPlan) / totalPlan * 100 : null;
  const topN = rowsVA.filter(r => r.plan).slice(0, 5);
  const planSubj = rowsVA.filter(r => r.plan).length, hitSubj = rowsVA.filter(r => r.plan && r.act).length;
  const matchRate = planSubj ? hitSubj / planSubj * 100 : null;
  const manualAmt = all.filter(r => r.matched_by === 'manual').reduce((s, r) => s + cny(r), 0);
  const ruleAmt = a.inflow + a.outflow - manualAmt;
  const manualCnt = all.filter(r => r.matched_by === 'manual').length;
  let streak = 0;
  for (let i = periods.length - 1; i >= 0; i--) {
    const { plan, actual } = periods[i];
    if (!plan || actual == null || Math.abs((actual - plan) / plan) <= 0.1) break;
    streak++;
  }
  const pend = S.snap.pending;

  return `
  <div class="pane-title"><h2>预实分析</h2><span>${esc(S.entity)} · ${PERIOD_LABEL(S.period)} · 实际=已匹配+人工确认；计划=已审批 · <b>已剔除内部往来 ${intRows.length} 笔 / ${big(intAmt)}</b></span></div>
  <div class="toolbar">
    <div class="field"><label>公司</label><select data-act="entity">${entityOptions(S.entity, '集团合计')}</select></div>
    <div class="field"><label>期间</label><select data-act="period">${periodOptions(S.period)}</select></div>
    <div class="spacer"></div>
    <a href="#" class="btn ghost sm" data-act="tab" data-tab="in-flow">去处理待确认（${pend}）</a>
  </div>
  ${!ps.length ? `<div class="banner warn"><span class="ic">⚠</span><div>本期没有已审批计划，偏差无法计算。到「资金计划编制」提交并审批后自动生效。${(S.meta.planBatches || []).filter(x => x.status !== 'approved').length ? '（已有待审批批次）' : ''}</div></div>`
    : !comparable ? `<div class="banner info"><span class="ic">i</span><div><b>偏差暂不可比，请核查数据。</b>${missingMonths.length ? '以下计划月没有已确认流水：' + esc(missingMonths.sort().join('、')) + '。' : ''}${S.snap.pending ? ' 本期存在待确认流水。' : ''}${(S.snap.missingFx || []).length ? ' 本期存在汇率缺失。' : ''}已有流水不代表当月流水完整。</div></div>` : `<div class="quality-strip">已找到同期确认流水；系统无法自动判断当月流水是否全部导入，请结合批次核对完整性。</div>`}

  <div class="kpis">
    ${kpi('计划合计', big(totalPlan), '元', `<span class="s">${ps.length} 行</span>`)}
    ${kpi('实际合计（同期）', comparable ? big(totalAct) : '—', '元', `<span class="s">${cmpRows.length} 笔同期确认流水</span>`, 'in')}
    ${kpi('总偏差率', !comparable || totalRate == null ? '—' : pctTxt(totalRate), '', `<span class="s">${!comparable || totalRate == null ? '数据待核查' : '偏差额 ' + big(totalAct - totalPlan)}</span>`, '')}
    ${kpi('连续偏差月数', comparable ? streak : '—', '月', `<span class="s">月度绝对偏差率 >10%</span>`, comparable && streak >= 2 ? 'warnline' : '')}
  </div>

  ${vaPeriodComparison(periods, qualityBlocked)}

  ${comparable ? `<div class="grid g32">
    <div class="card"><h3>科目偏差明细 <span>所选期间汇总 · 按绝对偏差降序</span></h3>
      ${svgDevBar(rowsVA)}
      <div class="hr"></div>
      <div class="scroll tall"><table class="tbl"><thead><tr><th>科目</th><th class="num">计划</th><th class="num">实际</th><th class="num">偏差额</th><th class="num">偏差率</th><th>方向</th><th>备注</th></tr></thead><tbody>
        ${rowsVA.length ? rowsVA.map(r => `<tr><td>${esc(r.l2 || '未分类')}<div class="mini">${esc(r.l1 || '')}</div></td>
          <td class="num">${r.plan ? yuan(r.plan) : '—'}</td><td class="num">${r.act ? yuan(r.act) : '—'}</td>
          <td class="num ${r.unfavist ? 'out' : r.dev > 0 ? 'in' : ''}">${r.plan ? yuan(r.dev) : '—'}</td>
          <td class="num">${pctTxt(r.rate)}</td>
          <td>${r.plan ? (r.unfavist ? '<span class="chip pending">需关注</span>' : '<span class="chip">需分析原因</span>') : '—'}</td>
          <td class="sub">${r.plan ? (r.act ? '' : '计划无实际（可能走了其他科目或流水未确认）') : '计划未列该科目，下期补列'}</td></tr>`).join('') : '<tr><td colspan="7" class="empty">无数据</td></tr>'}
      </tbody></table></div>
    </div>
    <div class="card"><h3>偏差贡献度 Top5 <span>所选期间汇总 · 按绝对偏差</span></h3>
      ${svgTopDev(topN)}
      <div class="hr"></div>
      ${topN.length ? `<table class="tbl"><thead><tr><th>科目</th><th class="num">偏差额</th><th class="num">占计划</th></tr></thead><tbody>
        ${topN.map(r => `<tr><td>${esc(r.l2)}</td><td class="num">${yuan(r.dev)}</td><td class="num">${totalPlan ? (r.dev / totalPlan * 100).toFixed(1) + '%' : '—'}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">无计划科目</div>'}
      <div class="hr"></div>
      <h3>方向结构 <span>流入 / 流出偏差</span></h3>
      <div class="kv" style="font-size:12px">
        <div class="k">流入：计划 / 实际</div><div class="v">${big(p.in)} / ${big(a.inflow)}</div>
        <div class="k">流入偏差率</div><div class="v">${p.in ? pctTxt((a.inflow - p.in) / p.in * 100) : '—'}</div>
        <div class="k">流出：计划 / 实际</div><div class="v">${big(p.out)} / ${big(a.outflow)}</div>
        <div class="k">流出偏差率（超支为不利）</div><div class="v">${p.out ? pctTxt((a.outflow - p.out) / p.out * 100) : '—'}</div>
        <div class="k">计划执行进度</div><div class="v">${p.in + p.out ? ((a.inflow + a.outflow) / (p.in + p.out) * 100).toFixed(0) + '%' : '—'}</div>
      </div>
      <div class="note">规则匹配 ${big(ruleAmt)} 元 / ${all.length - manualCnt} 笔；人工确认 ${big(manualAmt)} 元 / ${manualCnt} 笔。匹配度偏低时建议先清理待确认池。</div>
    </div>
  </div>` : '<div class="card empty">数据具备可比条件后显示科目偏差及方向分析。</div>'}`;
}

/* ---------- 4 现金流量表 ---------- */
function paneCF() {
  /* 内部往来剔除，不计入报表项目（标识取映射表 is_internal） */
  const rawAll = rows();
  const intRows = rawAll.filter(isInt);
  const intAmt = intRows.reduce((s, r) => s + cny(r), 0);
  const all = rawAll.filter(r => !isInt(r));
  const secMap = {};
  all.forEach(r => {
    const sec = r.cf_section || '未映射';
    const item = r.cf_item || '未映射';
    const k = sec + '|' + item;
    const o = secMap[k] || { sec, item, amt: 0, n: 0 };
    o.amt += (r.direction === '收' ? cny(r) : -cny(r));
    o.n++;
    secMap[k] = o;
  });
  const secs = {};
  Object.values(secMap).forEach(o => { (secs[o.sec] = secs[o.sec] || []).push(o); });
  const order = ['一、经营活动产生的现金流量', '二、投资活动产生的现金流量', '三、筹资活动产生的现金流量', '未映射'];
  // 报表标准项目：取映射表的 cf_section/cf_item 组合（去重、保持 sort 顺序），无流水也列出来记 0
  const STD = [], seen = {};
  SUBMAP().forEach(s => {
    if (!s.cf_section || !s.cf_item) return;
    const k = s.cf_section + '|' + s.cf_item;
    if (seen[k]) return; seen[k] = 1;
    STD.push({ sec: s.cf_section, item: s.cf_item });
  });
  const netOf = sec => (secs[sec] || []).reduce((s, o) => s + o.amt, 0);
  const netAll = Object.keys(secs).reduce((s, k) => s + netOf(k), 0);
  const opening = S.snap.start ? balancesAt(shiftMonth(S.snap.start, -1)).total : null;
  const ending = balancesAt(S.snap.end || '').total;
  const pend = S.snap.pending;

  return `
  <div class="pane-title"><h2>现金流量表（直接法）</h2><span>${esc(S.entity)} · ${PERIOD_LABEL(S.period)} · 映射表取数</span></div>
  <div class="toolbar">
    <div class="field"><label>公司</label><select data-act="entity">${entityOptions(S.entity, '集团合计')}</select></div>
    <div class="field"><label>期间</label><select data-act="period">${periodOptions(S.period)}</select></div>
    <div class="spacer"></div>
    <button class="btn ghost" data-act="cf-export" data-fmt="csv">下载 CSV</button>
    <button class="btn" data-act="cf-export" data-fmt="xlsx">下载 Excel</button>
  </div>

  <div class="grid g32">
    <div class="card"><h3>报表 <span>按 subject_map.cf_item 归并</span></h3>
      <table class="tbl"><thead><tr><th>项目</th><th class="num">金额（元）</th><th class="num">笔数</th></tr></thead><tbody>
        ${order.filter(s => secs[s] || STD.some(x => x.sec === s)).map(s => {
          const has = (secs[s] || []).slice();
          const items = STD.filter(x => x.sec === s)
            .map(x => has.find(o => o.item === x.item) || { item: x.item, amt: 0, n: 0 })
            .concat(has.filter(o => !STD.some(x => x.sec === s && x.item === o.item)));
          return `<tr class="sec"><td colspan="3">${esc(s)}</td></tr>
          ${items.map(o => `<tr><td>${esc(o.item)}</td><td class="num">${yuan(o.amt)}</td><td class="num sub">${o.n}</td></tr>`).join('')}
          <tr class="total"><td>${esc(s.slice(0, 2))} 净额</td><td class="num">${yuan(netOf(s))}</td><td></td></tr>`;
        }).join('')}
        <tr class="total"><td>现金及现金等价物净增加额</td><td class="num">${yuan(netAll)}</td><td></td></tr>
        <tr><td>加：期初余额</td><td class="num">${opening == null ? '暂无' : yuan(opening)}</td><td></td></tr>
        <tr class="total"><td>期末余额</td><td class="num">${ending == null ? '暂无' : yuan(ending)}</td><td></td></tr>
      </tbody></table>
      <div class="note">直接法：按 subject_map.cf_item 归并。<b>已抵销内部往来 ${intRows.length} 笔 / ${big(intAmt)} 元</b>，不计入任何报表项目（口径由映射表 is_internal 标识决定）。</div>
    </div>
    <div class="card"><h3>附注 <span>口径与待确认</span></h3>
      <div class="note">
        1. 实际数 = 已匹配 + 人工确认（flow_raw.status='confirmed'）；草稿与待确认不计入。<br>
        2. <b>尚有 ${pend} 笔待确认</b>，未计入本表；确认后自动进入并刷新聚合。<br>
        3. 活动类型与报表项目取自 subject_map 映射表，前端不再判断。<b>内部往来 ${intRows.length} 笔 / ${big(intAmt)} 元已抵销</b>，不计入报表。<br>
        4. 汇率取期间末生效汇率（USD/CNY ${fxOf('USD') ? fxOf('USD').rate : '缺失'}、HKD/CNY ${fxOf('HKD') ? fxOf('HKD').rate : '缺失'}）。<br>
        5. 期末余额取各账户最后一笔交易后余额；无逐笔余额账户不参与期初期末。
      </div>
      <div class="hr"></div>
      <div class="flexrow">
        <span class="chip">${all.length} 笔入表</span>
        <span class="chip ${pend ? 'pending' : 'matched'}">待确认 ${pend} 笔</span>
        <span class="chip">聚合 ${esc((S.snap.aggAt || '').slice(0, 16))}</span>
      </div>
    </div>
  </div>`;
}

/* ---------- 渲染 ---------- */
async function render() {
  try {
    if (S.tab !== 'g-over' && S.entity === 'ALL' && S.tab !== 'p-drill' && S.tab !== 'out-cf') S.entity = (E().find(e => !e.pending) || {}).short;
    S.scope = S.tab === 'g-over' ? 'ALL' : S.entity;
    const key = S.scope + '|' + S.period;
    if (S.snapKey !== key) { S.snap = await api('/api/snapshot?entity=' + encodeURIComponent(S.scope) + '&period=' + encodeURIComponent(S.period)); S.snapKey = key; }
    // 计划页：首次进入自动载入最近一条已审批批次，避免「上传过但看不到明细」
    if (S.tab === 'in-plan' && !S.planBatch.id && !S.planAutoTried && (S.meta.planBatches || []).length) {
      S.planAutoTried = true;
      const pbs = S.meta.planBatches;
      const pick = pbs.filter(x => x.status === 'approved').sort((a, b) => (b.id || 0) - (a.id || 0))[0]
        || pbs.slice().sort((a, b) => (b.id || 0) - (a.id || 0))[0];
      if (pick) { await openPlanBatch(pick.id); return; }
    }
    await ensureFull();
    await ensurePrev();
    buildSide();
    buildHeader();
    const map = { 'g-over': paneOverview, 'g-ent': paneEntity, 'in-flow': paneFlow, 'in-plan': panePlan, 'p-drill': paneDrill, 'p-va': paneVA, 'out-cf': paneCF };
    $('#pane').innerHTML = (map[S.tab] || paneOverview)();
    if (S.tab === 'in-flow' && (S.flowStep === 2)) await loadReview();
  } catch (e) {
    $('#pane').innerHTML = `<div class="banner warn"><span class="ic">✗</span><div><b>数仓未连接：</b>${esc(e.message)}<br>
      请先启动服务：数仓/v11/open_v11.bat（或 <span class="mono">.venv/Scripts/python.exe 数仓/v11/server11.py</span>）。</div></div>`;
    console.error(e);
  }
}
async function loadReview() {
  const q = '?entity=' + encodeURIComponent(S.batch.entity || S.entity) + '&period=' + encodeURIComponent(S.batch.period || S.period);
  const p = await api('/api/pending' + q);
  // 本批全部记录（含已确认）优先；没有批次时看全量待确认池
  S.pendingRows = S.batch.id ? (await api('/api/batch-rows?batchId=' + S.batch.id)).rows : p.rows;
  const snap = await api('/api/snapshot?entity=' + encodeURIComponent(S.batch.entity || S.entity) + '&period=' + encodeURIComponent(S.batch.period || S.period));
  // 已确认列表只列「本批」的记录，避免把其他批次/期间的确认流水混进来
  S.confirmedRows = (S.batch.id
    ? (S.pendingRows || []).filter(r => r.status === 'confirmed')
    : snap.rows.filter(r => r.status === 'confirmed')).slice().reverse();
  const box = $('#pane');
  const map = { 'g-over': paneOverview, 'g-ent': paneEntity, 'in-flow': paneFlow, 'in-plan': panePlan, 'p-drill': paneDrill, 'p-va': paneVA, 'out-cf': paneCF };
  box.innerHTML = (map[S.tab] || paneFlow)();
}

/* 把批次真实状态同步到本地状态：导入后/保存后页面头部的「已确认只读」要与库里一致 */
async function syncBatchState() {
  if (!S.batch.id) return;
  try {
    const nb = await api('/api/flow/batch?batchId=' + S.batch.id);
    if (nb.batch) S.batch = Object.assign(S.batch, {
      status: nb.batch.status,
      confirmed_at: nb.batch.confirmed_at || '',
      updated_at: nb.batch.updated_at || ''
    });
  } catch (e) { /* 状态同步失败不影响主流程 */ }
}

/* ---------- 事件 ---------- */

      if (r && r.rules) S.meta.restrictedRules = r.rules;
      await loadSnap();

    }

    if (act === 'drill-act') { S.drillAct = t.dataset.a; S.drillCat = ''; S.drillAmt = 0; await render(); return; }
    if (act === 'drill-cat') { S.drillCat = t.dataset.c || ''; await render(); return; }
    if (act === 'drill-dir2') { S.drillDir2 = t.dataset.d; await render(); return; }

    if (act === 'pickFlow') { if (!S.batch.entity || !S.batch.period) { S.err = '请先填写公司与期间'; await render(); return; } $('#fileFlow').click(); return; }
    if (act === 'pickPlan') { if (!S.planBatch.entity || !S.planBatch.period) return toast('请先选择公司与期间'); $('#filePlan').click(); return; }
    if (act === 'selall') {
      const list = S.pendingRows || [];
      if (S.sel.size === list.length) S.sel.clear(); else list.forEach(r => S.sel.add(r.id));
      await loadReview(); return;
    }
    if (act === 'bulk-apply') {
      const code = ($('#bulk-code') || {}).value;
      if (!code) return toast('先选要应用的科目');
      if (!S.sel.size) return toast('先勾选行');
      S.sel.forEach(id => { const s = document.querySelector(`select[data-code="${id}"]`); if (s) s.value = code; });
      toast(`已为 ${S.sel.size} 行预填，点「确认所选」生效`);

    }

      if (!ids.length && act === 'confirm-all') { toast('本批已全部确认'); await loadReview(); return; }
      if (!ids.length) return toast('先勾选要确认的行');
      // 分批：每行按其下拉选择或已有 code

      toast((r.changed

        : '没有需要保存的改动（所选科目与库里一致）') + warn);

    }
    if (act === 'confirm-batch') {
      // 先把手上的选择落库（未保存的选择也能直接确认）
      const picks = collectFlowPicks();
      if (picks.length) await post('/api/flow/save', { batchId: S.batch.id, items: picks, operator: opName() });
      const r = await post('/api/flow/confirm-batch', { batchId: S.batch.id, operator: opName() });
      if (r.error) return toast(r.error);
      S.pick = {};
      await loadMeta(); await loadSnap();

  } catch (e) { toast(e.message); console.error(e); }
});

document.addEventListener('change', async ev => {
  const el = ev.target;
  if (el.id === 'b-entity') { S.batch.entity = el.value; S.err = ''; await render(); return; }
  if (el.id === 'b-period') {
    const v = String(el.value || '').slice(0, 7);
    S.batch.period = /^\d{4}-\d{2}$/.test(v) ? v : '';
    S.err = ''; await render(); return;
  }
  if (el.id === 'b-operator') { localStorage.setItem('v11.op', el.value); return; }
  if (el.id === 'p-applicant') {
    S.planBatch.applicant = el.value.trim();
    if (S.planBatch.applicant) localStorage.setItem('v11.applicant', S.planBatch.applicant);
    return;
  }
  if (el.id === 'p-entity') { S.planBatch.entity = el.value; await render(); return; }
  if (el.id === 'p-period') {
    const v = String(el.value || '').slice(0, 7);
    S.planBatch.period = /^\d{4}-\d{2}$/.test(v) ? v : '';
    await render(); return;
  }
  if (el.id === 'fileFlow' || el.id === 'filePlan') return;
  // 人工识别：一级科目 → 二级科目联动
  if (el.dataset.l1) {
    const id = Number(el.dataset.l1);
    const prev = S.pick[id] || {};
    const keep = prev.code && (smByCode(prev.code) || {}).l1 === el.value;
    S.pick[id] = { l1: el.value, code: keep ? prev.code : '' };
    await render();
    return;
  }
  // 人工识别：冲减下拉（选二级科目 = 按该科目冲减；空 = 正常记账）
  if (el.dataset.offset) {
    const id = Number(el.dataset.offset);
    const row = (S.pendingRows || []).find(r => r.id === id);

/* 人工识别的实时计数（含未保存的下拉选择） */
function flowCounts() {
  const all = S.pendingRows || [];
  const codeOf = r => { const p = S.pick[r.id]; return p ? (p.code || '') : (r.code || ''); };
  const idn = r => !!String(codeOf(r)).trim();
  return {
    total: all.length,
    id: all.filter(idn).length,
    un: all.filter(r => !idn(r)).length,
    todo: all.filter(r => idn(r) && r.status !== 'confirmed').length,
    confirmed: all.filter(r => r.status === 'confirmed').length
  };
}
/* 选完二级科目后就地刷新：筛选 chip 计数、状态列、全部确认按钮（不重排表格，避免行跳动） */
function refreshFlowBar(changedId) {
  const c = flowCounts();
  const chips = { un: `未识别 ${c.un}`, id: `已识别 ${c.id}`, all: `全部 ${c.total}` };
  document.querySelectorAll('[data-act=flow-filter]').forEach(b => {
    const k = b.dataset.f;
    if (chips[k]) b.textContent = chips[k];
  });
  const sum = document.querySelector('[data-flow-sum]');
  if (sum) sum.textContent = `本批 ${c.total} 笔 · 已确认 ${c.confirmed} 笔 · 待确认 ${c.total - c.confirmed} 笔`;
  const btn = document.querySelector('[data-act=confirm-batch]');
  if (btn) {
    btn.textContent = `全部确认（已识别 ${c.todo} 笔）`;
    btn.disabled = !c.todo;
    btn.classList.toggle('off', !c.todo);
  }
  if (changedId) {
    const sel = document.querySelector(`select[data-code="${changedId}"]`);
    const tr = sel && sel.closest('tr');
    const row = (S.pendingRows || []).find(r => r.id === changedId);
    if (tr && row) {
      const cell = tr.lastElementChild;
      const code = (S.pick[row.id] || {}).code || '';
      cell.innerHTML = row.status === 'confirmed'
        ? '<span class="chip matched">已确认</span>'
        : row.modified ? '<span class="chip pending">未确认（已修改）</span>'
          : (code ? '<span class="chip">已识别 · 待确认</span>' : '<span class="chip pending">未识别</span>');
    }
  }
}

/* 采集人工识别页当前的科目选择：二级没换就沿用库里更细的 code（其他支出这类细分编码不被抹平） */
function collectFlowPicks() {
  const items = [];
  document.querySelectorAll('select[data-code]').forEach(sel => {
    const id = Number(sel.dataset.code);
    const row = (S.pendingRows || []).find(r => r.id === id);
    // 冲减：显式动过下拉以选择为准；没动过的行保留库里的冲减标记（如继承原笔的冲减行）
    const oSel = document.querySelector('select[data-offset="' + id + '"]');
    const picked = S.pick[id] || null;
    const pickOff = (picked && ('offset' in picked)) ? !!picked.offset : null;
    const wantOff = pickOff !== null ? pickOff : !!(row && row.offset_of);   // 只是点开看看不算冲减
    const opt = smByCode(sel.value);
    let code = sel.value || '';
    // 下拉里没有该行原有科目（一级/方向联动过滤掉）→ 保留库里的 code，不要当成「清空科目」
    if (!code && row && row.code && !Array.from(sel.options).some(o => o.value === row.code)) code = row.code;
    if (row && row.code && opt) {
      const oldSm = smByCode(row.code);
      if (oldSm && oldSm.l2 === opt.l2) code = row.code;
    }
    if (wantOff) code = (picked && picked.code) || (oSel && oSel.value) || code;   // 冲减科目就是这个 code
    items.push({ id, code, offset: wantOff });
  });
  return items;
}

/* 文件上传：解析 → 建批次 → 逐笔落库 */
async function handleFlowFiles(files) {
  if (!files.length) return;
  const b = S.batch;
  if (!b.entity || !b.period) { S.err = '请先填写公司与期间'; await render(); return; }
  S.err = '';
  let total = 0, allRows = [], dupInFile = [], errors = [], pdfWarnings = [];
  const outRows = [];   // 文件里不属于所选期间的流水（跳过）
  for (const f of files) {
    try {
      const raw = await readFileRows(f);
      if (raw.pdfInfo) {
        const owner = raw.pdfInfo.owner || '';
        const selected = E().find(e => e.short === b.entity) || {};
        if (raw.pdfInfo.currency && selected.ccy && raw.pdfInfo.currency !== selected.ccy) {
          errors.push(`${f.name}：PDF 币种 ${raw.pdfInfo.currency} 与所选公司币种 ${selected.ccy} 不一致，请先核对公司设置`); continue;
        }
        if (owner && owner.toUpperCase() !== String(selected.name || '').toUpperCase() &&
            !window.confirm(`PDF 账户名称：${owner}\n当前选择公司：${selected.name || b.entity}\n两者名称不完全一致，请核对后决定是否继续。`)) {
          errors.push(`${f.name}：账户名称未确认`); continue;
        }
        pdfWarnings.push(...raw.pdfInfo.warnings);
      }
      const parsed = parseFlowFile(raw, f.name, b.entity);
      if (parsed.error) { errors.push(`${f.name}：${parsed.error}`); continue; }
      total += parsed.rows.length;
      allRows = allRows.concat(parsed.rows);
      dupInFile = dupInFile.concat(parsed.dupInFile || []);
    } catch (e) { errors.push(`${f.name}：${e.message}`); }
  }
  if (!allRows.length) { S.err = errors.join('；') || '未解析到有效行'; S.parse = null; await render(); return; }
  // 只导入所选期间的流水：文件里其他月份的行跳过并提示，避免批次里混入别的月份
  const keep = [];
  for (const r of allRows) {
    const m = String(r.date || '').slice(0, 7);
    if (b.period && m && m !== b.period) { outRows.push(r); continue; }
    keep.push(r);
  }
  allRows = keep;
  const outMonths = Array.from(new Set(outRows.map(r => String(r.date || '').slice(0, 7)))).filter(Boolean).sort();
  if (!allRows.length) {
    S.err = `文件里没有 ${b.period} 的流水（实际包含 ${outMonths.join('、')}，共 ${outRows.length} 行已跳过）。请确认期间，或换当月流水文件。`;
    S.parse = null; await render(); return;
  }
  // 文件指纹
  const sha = await sha256([b.entity, b.period, ...files.map(f => f.name + f.size)].join('|'));
  const rb = await post('/api/batch', { entity: b.entity, period: b.period, fileName: files.map(f => f.name).join('、'), sha, operator: localStorage.getItem('v11.op') || '操作员' });
  if (rb.duplicate) {
    const ok = window.confirm(
      `该文件已在批次 #${rb.batch.id} 导入过（${rb.batch.file_name || ''}）。\n\n` +
      `继续会按「笔」去重：库里已有的流水自动跳过，不会重复入账。\n要基于该批次继续导入吗？`);
    if (!ok) {
      S.err = `已取消：该文件与批次 #${rb.batch.id} 重复（如需全新批次，请先「新建申请」）`;
      await render(); return;
    }
    S.err = '';
  }
  const ri = await post('/api/import', { batchId: rb.batch.id, rows: allRows, submit: true });
  S.parse = { total, rows: allRows, dup: ri.dup, dupRows: ri.dupRows, repaired: ri.repaired || 0, dupInFile, hit: ri.inserted - ri.pending,
    outPeriod: outRows.length, outMonths, errors: errors.concat(ri.errors || [], pdfWarnings) };
  S.batch.id = ri.batchDropped ? null : rb.batch.id;
  S.batch.status = ri.batchDropped ? '' : 'parsed';
  await syncBatchState();
  S.pick = {}; S.flowFilter = 'un';
  S.batch.file = files.map(f => f.name).join('、');   // 解析结果卡要显示文件名
  await loadMeta(); await loadSnap(); await render();
  const skipMsg = outRows.length ? `；另有 ${outRows.length} 笔不属于 ${b.period} 已跳过` : '';
  const fixMsg = ri.repaired ? `，补全旧记录 ${ri.repaired} 笔（对方户名/账号）` : '';
  toast(ri.batchDropped || ri.inserted === 0
    ? `这 ${ri.dup} 笔在库里已存在，未新增数据${fixMsg}${skipMsg}`
    : `已落库 ${ri.inserted} 笔（待确认 ${ri.pending}），重复跳过 ${ri.dup} 笔${fixMsg}${skipMsg}`);
}
async function sha256(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 32);
}
async function handlePlanFile(file) {
  if (!file) return;
  const b = S.planBatch;
  if (!b.entity || !b.period) return toast('请先选择公司与期间');
  try {
    const raw = await readFileRows(file);
    const hi = raw.findIndex(r => (r || []).some(c => String(c).includes('科目')));
    const hdr = raw[hi] || [];
    const idx = name => hdr.findIndex(h => String(h).replace(/\s/g, '').includes(name));
    const iEnt = idx('公司主体'), iDir = idx('收支方向'), iL1 = idx('科目大类'), iL2 = idx('科目明细'), iAmt = idx('预算金额'), iNote = idx('备注');
    if (iL2 < 0 || iAmt < 0) { S.planBatch.issues = ['模板字段不匹配：缺少「科目明细」或「预算金额」列']; await render(); return; }
    const out = [], issues = [];
    for (let i = hi + 1; i < raw.length; i++) {
      const r = raw[i] || [];
      const l2raw = String(r[iL2] || '').replace(/\s/g, '');
      const amt = num(r[iAmt]);
      const ent = iEnt >= 0 ? String(r[iEnt] || '').trim() : '';
      if (!l2raw || isNaN(amt) || !amt) continue;
      if (ent === 'XXX' || ent === '/') { issues.push(`第 ${i + 1} 行主体为占位符（${ent}），已跳过`); continue; }
      let sm = SUBMAP().find(s => s.l2 === l2raw);
      if (!sm) {
        const legacy = { '销售回款（商品/渠道分销）': '货款收入', '人力薪酬及社保公积金': '工资性支出', '采购货款与生产成本': '采购支出', '市场推广及渠道佣金': '营销费用支出', '研发投入（材料/委外）': '其他支出', '差旅及业务招待': '其他支出', '物流仓储及履约': '物流费用', 'IT与软件订阅': '其他支出', '其他经营流出': '其他支出', '支付利息': '支付利息支出' };
        sm = SUBMAP().find(s => s.l2 === legacy[l2raw]);
      }
      if (!sm) { issues.push(`第 ${i + 1} 行科目「${l2raw}」无法映射到 22 项，已跳过`); continue; }
      out.push({ entity: b.entity, period: b.period, direction: (iDir >= 0 ? String(r[iDir]).trim() : '') === '流入' ? '流入' : (sm.direction === '收' ? '流入' : '流出'), l1: sm.l1, l2: sm.l2, code: sm.code, amount: Math.abs(amt), note: iNote >= 0 ? String(r[iNote] || '') : '' });
    }
    if (!out.length) { S.planBatch.issues = ['没有解析到有效计划行'].concat(issues); await render(); return; }
    S.planBatch.rows = out; S.planBatch.file = file.name; S.planBatch.issues = issues; S.planStep = 2;
    // 校验通过即落库成「可编辑」批次：数据不丢，审批前不参与预实
    const r = await post('/api/plan', {
      entity: b.entity, period: b.period, fileName: file.name, rows: out, operator: opName()
    });
    if (r.error) { S.planBatch.issues = issues.concat(r.error); await render(); return; }
    S.planBatch.id = r.batch;
    await loadMeta(); await render();
    toast(`解析 ${out.length} 行，已保存至数仓（${stamp()}）· 批次 #${r.batch}`);
  } catch (e) { S.planBatch.issues = [e.message]; await render(); }
}

    await loadSnap();
    await render();
  } catch (e) {
    document.getElementById('pane').innerHTML = `<div class="card"><h3>未连接数仓</h3>
      <div class="note">${esc(e.message)}<br><br>启动服务后刷新：<br>
      <span class="mono">数仓/v11/open_v11.bat</span><br>
      或 <span class="mono">.venv/Scripts/python.exe 数仓/v11/server11.py</span></div></div>`;
  }
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
